    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;

  .card { position: relative; }

  .card::before { left: -1px; border-top: 2px solid #D6F23C; border-left: 2px solid #D6F23C; }
  .card::after { right: -1px; border-top: 2px solid #D6F23C; border-right: 2px solid #D6F23C; }

  .scan { height: 1px; background: linear-gradient(90deg, transparent, #2A3550 15%, #2A3550 85%, transparent); }
  .ball-bounce { animation: ballBounce 1.3s cubic-bezier(0.5,0,0.5,1) infinite; transform-origin: 50% 92%; }
  @keyframes ballBounce {
    0%   { transform: translateY(0) scaleX(1); }
    35%  { transform: translateY(-7px) scaleX(1); }
    55%  { transform: translateY(0) scaleX(1.06); }
    70%  { transform: translateY(-2px) scaleX(1); }
    100% { transform: translateY(0) scaleX(1); }
  }
  .racket-bg { position: absolute; pointer-events: none; opacity: 0.16; }

    }

  function miniRankChart(history) {
    if (!history || history.length < 2) {
      return '<div style="color:' + C.muted + ';font-size:12px;text-align:center;padding:14px">Todavía no hay suficiente historial para graficar.</div>';
    }
    var w = 280, hgt = 110, pad = 14;
    var n = history.length;
    var ranks = history.map(function (r) { return r.rank; });
    var minR = Math.min.apply(null, ranks), maxR = Math.max.apply(null, ranks);
    if (minR === maxR) { minR -= 1; maxR += 1; }
    var coords = history.map(function (r, i) {
      var x = pad + (i / (n - 1)) * (w - pad * 2);
      var y = pad + ((r.rank - minR) / (maxR - minR)) * (hgt - pad * 2 - 14) + 14;
      return { x: x, y: y, rank: r.rank };
    });
    var pts = coords.map(function (c) { return c.x.toFixed(1) + "," + c.y.toFixed(1); });
    var dotsAndLabels = coords.map(function (c, i) {
      var above = c.y > 22;

      return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="2.5" fill="' + C.accent + '"/>' +
        '<text x="' + c.x.toFixed(1) + '" y="' + labelY.toFixed(1) + '" font-size="9" fill="' + C.muted + '" text-anchor="' + (i === 0 ? "start" : i === coords.length - 1 ? "end" : "middle") + '" font-family="monospace">' + c.rank + '</text>';
    }).join("");
    var svg = '<svg width="100%" viewBox="0 0 ' + w + ' ' + hgt + '" style="display:block;width:100%;height:auto;aspect-ratio:' + w + '/' + hgt + '">' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + C.accent + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      dotsAndLabels +
      '</svg>';
    var first = history[0], last = history[history.length - 1];
    var html = svg + '<div style="display:flex;justify-content:space-between;font-size:10px;color:' + C.muted + ';margin-top:2px">';
    html += '<span class="mono">' + fmtShort(new Date(first.recorded_at)) + '</span>';
    html += '<span class="mono">' + fmtShort(new Date(last.recorded_at)) + '</span>';
    html += '</div>';
    html += '<div style="max-height:150px;overflow-y:auto;margin-top:10px;border-top:1px solid ' + C.line + '">';
    history.slice().reverse().forEach(function (r, i) {
      html += '<div style="display:flex;justify-content:space-between;padding:5px 2px;' + (i < history.length - 1 ? "border-bottom:1px solid " + C.line : "") + ';font-size:11.5px">';

      html += '<span class="mono" style="color:' + C.accent + ';font-weight:700">#' + r.rank + '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function findRank(name) {
    if (!state.ranking || !state.ranking.list) return null;
    var n = normalizeName(name);
    for (var i = 0; i < state.ranking.list.length; i++) {

  function orderActive(list) {

  function getActiveList(type) {
    var list = state.sessions[type] || [];

  function getConfirmed(type) { return getActiveList(type).slice(0, capacityFor(type, metas()[type].key)); }
  function getWaitlist(type) { return getActiveList(type).slice(capacityFor(type, metas()[type].key)); }
  function myStatus(type) {
    if (!state.player) return null;
    var active = getActiveList(type);
    var idx = -1;
    for (var i = 0; i < active.length; i++) if (active[i].playerId === state.player.id) { idx = i; break; }

      for (var j = 0; j < active.length; j++) if (!active[j].playerId && normalizeName(active[j].name) === myName) { idx = j; break; }
    }
    if (idx === -1) return null;
    return { position: idx + 1, confirmed: idx < capacityFor(type, metas()[type].key), ts: active[idx].ts };

  function spliceGlobalRank(list, entry, newRank) {
    var oldRank = entry.rank;
    if (newRank === oldRank) return;
    if (newRank < oldRank) {
      list.forEach(function (e) {
        if (e !== entry && e.rank >= newRank && e.rank < oldRank) e.rank += 1;
      });
    } else {
      list.forEach(function (e) {
        if (e !== entry && e.rank > oldRank && e.rank <= newRank) e.rank -= 1;
      });
    }
    entry.rank = newRank;
  }

  function applyResultsToRanking(courts, sessionType, sessionDate) {
    var list = state.ranking && state.ranking.list ? state.ranking.list.slice() : [];
    function findEntry(name) {
      var n = normalizeName(name);
      for (var i = 0; i < list.length; i++) if (normalizeName(list[i].name) === n) return list[i];
      return null;
    }
    var ops = [];
    var historyRows = [];
    var totalCourts = courts.length;
    var originalRanks = {};
    var originalDropCount = {};
    var originalDropCourt = {};
    list.forEach(function (e) {
      originalRanks[e.name] = e.rank;
      originalDropCount[e.name] = e.pendingDropCount || 0;
      originalDropCourt[e.name] = e.pendingDropFromCourt || null;
    });

    courts.forEach(function (court, ci) {
      if (court.length < 4) return;
      court.forEach(function (p) {
        if (!findEntry(p.name)) {
          var maxRank = list.reduce(function (m, r) { return Math.max(m, r.rank); }, 0);
          var fresh = { rank: maxRank + 1, name: p.name, pendingDropCount: 0, pendingDropFromCourt: null };
          list.push(fresh);
          originalRanks[fresh.name] = fresh.rank;
          originalDropCount[fresh.name] = 0;
          originalDropCourt[fresh.name] = null;
          ops.push(sb.from("ranking").insert({ name: fresh.name, rank: fresh.rank }));
        }
      });
      var entries = court.map(function (p) { return { p: p, entry: findEntry(p.name) }; }).filter(function (x) { return x.entry; });
      if (entries.length < 2) return;
      entries.sort(function (a, b) { return (a.p.position || 9) - (b.p.position || 9); });

      var iterations = 0, changed = true;
      while (changed && iterations < 20) {
        changed = false;
        iterations++;
        for (var i = 0; i < entries.length; i++) {
          for (var j = i + 1; j < entries.length; j++) {
            if (entries[i].entry.rank > entries[j].entry.rank) {
              spliceGlobalRank(list, entries[i].entry, entries[j].entry.rank);
              changed = true;
            }
          }
        }
      }

      var isLastCourt = ci === totalCourts - 1;
      var courtLabel = String.fromCharCode(65 + ci);
      entries.forEach(function (x) {
        x.entry.pendingDropCount = 0;
        x.entry.pendingDropFromCourt = null;
        if (x.p.position === 4 && !isLastCourt) {
          x.entry.pendingDropCount = 1;
          x.entry.pendingDropFromCourt = courtLabel;
        }
      });
    });

    list.forEach(function (entry) {
      var rankBefore = originalRanks[entry.name];
      var countBefore = originalDropCount[entry.name];
      var courtBefore = originalDropCourt[entry.name];
      var rankChanged = rankBefore != null && rankBefore !== entry.rank;
      var dropChanged = countBefore !== (entry.pendingDropCount || 0) || courtBefore !== (entry.pendingDropFromCourt || null);
      if (!rankChanged && !dropChanged) return;
      var payload = { pending_drop_count: entry.pendingDropCount || 0, pending_drop_from_court: entry.pendingDropFromCourt || null, updated_at: new Date().toISOString() };
      if (rankChanged) {
        entry.previousRank = rankBefore;
        payload.rank = entry.rank;
        payload.previous_rank = rankBefore;
        historyRows.push({ name: entry.name, rank: entry.rank, session_type: sessionType || null, session_date: sessionDate || null });
      }
      ops.push(sb.from("ranking").update(payload).eq("name", entry.name));
    });
    if (historyRows.length) ops.push(sb.from("ranking_history").insert(historyRows));
    return Promise.all(ops);
  }

    html += '<div style="font-size:11px;color:' + C.muted + ';text-align:center;line-height:1.5">Tu contraseña se maneja de forma segura y cifrada.</div>';
    html += '</div>';
    return html;
  }

  function fmtCountdown(target) {
    var diff = target - state.now;
    if (diff <= 0) return null;
    if (diff < 3 * 60000) {
      var secs = Math.ceil(diff / 1000);
      var m = Math.floor(secs / 60);
      var s = secs % 60;
      return m + "m " + (s < 10 ? "0" : "") + s + "s";
    }
    var totalMin = Math.floor(diff / 60000);
    var days = Math.floor(totalMin / 1440);
    var hours = Math.floor((totalMin % 1440) / 60);
    var mins = totalMin % 60;
    var parts = [];
    if (days > 0) parts.push(days + "d");
    if (days > 0 || hours > 0) parts.push(hours + "h");
    parts.push(mins + "m");
    return parts.join(" ");
  }

  function myTodayCourtInfo(type) {
    var today = pastOccurrences(type, 1)[0];
    if (dateKey(state.now) !== today.key) return null;
    var cache = state.todayMatchCache[type];
    if (!cache || cache.key !== today.key) {
      var loadKey = type + ":" + today.key;
      if (state.todayMatchLoading !== loadKey) {
        state.todayMatchLoading = loadKey;
        fetchConfirmations(type, today.key).then(function (list) {
          var active = orderActive(list.filter(function (c) { return !c.cancelled; }));
          state.todayMatchCache[type] = { key: today.key, list: active };
          state.todayMatchLoading = null;
          render();
        });
      }
      return null;
    }
    var confirmed = cache.list.slice(0, capacityFor(type, today.key));
    var courts = buildCourts(confirmed);
    var myName = normalizeName(state.player.name);
    for (var ci = 0; ci < courts.length; ci++) {
      for (var pi = 0; pi < courts[ci].length; pi++) {
        if (courts[ci][pi].playerId === state.player.id || normalizeName(courts[ci][pi].name) === myName) {
          return { occ: today, court: courts[ci], courtIndex: ci, myPos: pi };
        }
      }
    }
    return null;
  }

  function mySelfCaptureSlot(type) {
    var info = myTodayCourtInfo(type);
    if (!info || info.court.length < 4) return null;
    var unlockAt = new Date(info.occ.date); unlockAt.setHours(21, 15, 0, 0);
    if (state.now < unlockAt) return null;
    return { occ: info.occ, court: info.court, courtIndex: info.courtIndex };
  }

  var SET_ROTATIONS = [[[0, 3], [1, 2]], [[0, 2], [1, 3]], [[0, 1], [2, 3]]];
  function mySetLineup(myPos, court) {
    return SET_ROTATIONS.map(function (pairs) {
      var myTeam = pairs[0].indexOf(myPos) !== -1 ? pairs[0] : pairs[1];
      var oppTeam = myTeam === pairs[0] ? pairs[1] : pairs[0];
      var partnerPos = myTeam.filter(function (p) { return p !== myPos; })[0];
      return { partner: court[partnerPos].name, opponents: oppTeam.map(function (p) { return court[p].name; }) };
    });
  }

    html += '<div style="font-size:11px;color:' + C.muted + ';margin-bottom:6px;font-weight:600">CON QUIÉN JUEGAS</div>';

      var badgeColor = { 1: C.accent, 2: C.accent2, 3: "#8C97B3", 4: C.danger };
      html += '<div style="font-size:11px;color:' + C.muted + ';margin:12px 0 6px;font-weight:600">TU FORMA RECIENTE</div><div style="display:flex;gap:5px">';
      state.myResults.slice(0, 5).forEach(function (r) {
        html += '<span style="width:24px;height:24px;border-radius:50%;background:' + (badgeColor[r.position] || C.line) + ';color:' + C.bg + ';font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">' + r.position + '</span>';

    html += '</div>';

  function applyPositionsFromGames(court, games) {
    if (!court || !games) return;
    var totals = court.map(function (p, pi) { return { pi: pi, total: typeof games[pi] === "number" ? games[pi] : 0 }; });
    if (totals.every(function (t) { return t.total === 0; })) { window.alert("Captura los juegos ganados de al menos uno para poder calcular."); return; }
    totals.sort(function (a, b) { return b.total - a.total; });
    totals.forEach(function (t, rank) { court[t.pi].position = rank + 1; });
  }

  function rankArrow(r) {
    var STALE_MS = 4 * 24 * 60 * 60 * 1000;

    if (r.previousRank == null || r.previousRank === r.rank || !isRecent) {
      return '<span title="se mantuvo esta semana" style="color:#F2C94C;font-size:13px">▬</span>';
    }
    if (r.rank < r.previousRank) {
      return '<span title="subió" style="color:' + "#57D08C" + ';font-size:13px;font-weight:700">▲ ' + (r.previousRank - r.rank) + '</span>';
    }
    return '<span title="bajó" style="color:' + "#FF6B6B" + ';font-size:13px;font-weight:700">▼ ' + (r.rank - r.previousRank) + '</span>';
  }

  var FIXED_PAYERS_TO_FONDO = ["Luis Hurtado", "Mauricio Sierra", "Luis Ita", "Eduardo Sotomayor", "Jorge Vidal"];

  function computeMondayPayers(sortedConfirmed, courtsCount) {
    var active = PAGO_COLLECTORS.filter(function (c) { return !c.minCourts || courtsCount > c.minCourts; });
    var excludeSet = {};
    active.forEach(function (c) { excludeSet[normalizeName(c.matchName)] = true; });
    var fixedSet = {};
    FIXED_PAYERS_TO_FONDO.forEach(function (n) { fixedSet[normalizeName(n)] = true; });
    var fixedPlaying = sortedConfirmed.filter(function (p) { return fixedSet[normalizeName(p.name)] && !excludeSet[normalizeName(p.name)]; });
    var payers = sortedConfirmed.filter(function (p) { return !excludeSet[normalizeName(p.name)] && !fixedSet[normalizeName(p.name)]; });
    var collectors = active.map(function (c) {
      var isPlaying = sortedConfirmed.some(function (p) { return normalizeName(p.name) === normalizeName(c.matchName); });
      var needed = c.forced4 ? 4 : (isPlaying ? 3 : 4);
      if (c.forced4) needed = Math.max(0, needed - fixedPlaying.length);
      return { label: c.label, email: c.email, needed: needed };
    }).filter(function (c) { return c.needed > 0; });

    var assignments = collectors.map(function (c) { return { label: c.label, email: c.email, needed: c.needed, players: [] }; });
    var queue = payers.slice();
    var progressed = true;
    while (queue.length && progressed) {
      progressed = false;
      for (var k = 0; k < assignments.length; k++) {
        if (!queue.length) break;
        if (assignments[k].players.length < assignments[k].needed) {
          assignments[k].players.push(queue.shift().name);
          progressed = true;
        }
      }
    }
    var leftover = queue.map(function (p) { return p.name; });

    return { payers: payers.map(function (p) { return p.name; }), fixed: fixedPlaying.map(function (p) { return p.name; }), collectors: collectors, assignments: assignments, leftover: leftover };
  }

    html += '</div>';

    html += renderConfirmationLog(state.adminSessionTab);
    html += renderLateCancellations();
    return html;

  function renderConfirmationLog(type) {
    var raw = state.sessions[type] || [];
    var events = [];
    raw.forEach(function (c) {
      events.push({ kind: "in", name: c.name, ts: c.ts, playerId: c.playerId });
      if (c.cancelled && c.cancelledTs) {
        events.push({ kind: "out", name: c.name, ts: c.cancelledTs, late: c.late });
      }
    });
    events.sort(function (a, b) { return b.ts - a.ts; });
    var html = '<div class="hd" style="font-size:16px;margin:20px 0 8px">Log de esta semana</div>';
    if (!events.length) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:14px;text-align:center;background:' + C.panel + ';border-radius:12px;border:1px solid ' + C.line + '">Sin actividad todavía.</div>';
      return html;
    }
    html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.line + ';border-radius:12px;overflow:hidden;max-height:340px;overflow-y:auto">';
    events.forEach(function (ev, i) {
      var isIn = ev.kind === "in";
      var color = isIn ? C.good : "#F2C94C";
      var icon = isIn ? "➕" : "➖";
      var label = isIn ? "confirmó" : (ev.late ? "canceló (tardía)" : "canceló");
      html += '<div style="display:flex;align-items:center;gap:9px;padding:8px 12px;' + (i < events.length - 1 ? "border-bottom:1px solid " + C.line : "") + ';border-left:3px solid ' + color + '">';
      html += '<span style="font-size:13px">' + icon + '</span>';
      html += '<div style="flex:1"><span style="font-size:12.5px">' + esc(ev.name) + '</span> <span style="font-size:11px;color:' + color + '">' + label + '</span></div>';
      html += '<span class="mono" style="font-size:10px;color:' + C.muted + '">' + fmtExact(ev.ts) + '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

    html += '<div class="hd" style="font-size:16px;margin-bottom:8px">Editar ranking</div>';

      html += '<div style="font-size:11px;color:' + C.muted + ';margin-bottom:8px">Cambia el número o el nombre y dale "Guardar cambios" al final — nada se manda al servidor hasta entonces.</div>';

        html += '<input value="' + esc(r.name) + '" oninput="AppActions.draftRankingName(' + i + ',this.value)" style="flex:1;padding:6px;border-radius:6px;border:1px solid ' + C.line + ';background:' + C.panel2 + ';color:' + C.text + ';font-size:12.5px">';
        html += '</div>';

      html += '</div>';
      if (state.rankingDraftError) html += '<div style="color:' + C.danger + ';font-size:11.5px;margin-top:8px">' + esc(state.rankingDraftError) + '</div>';
      html += '<div style="display:flex;gap:8px;margin-top:10px">';

      html += '<button onclick="AppActions.saveRankingDraft()" ' + (dirty ? "" : "disabled") + ' class="glow" style="flex:1;padding:10px;border-radius:8px;border:none;background:' + (dirty ? C.accent : C.line) + ';color:' + (dirty ? C.bg : C.muted) + ';font-weight:700;font-size:13px;cursor:' + (dirty ? "pointer" : "default") + '">💾 Guardar cambios' + (dirty ? "" : " (sin cambios)") + '</button>';
      html += '</div>';
    }
    return html;

  function renderAdminPlayers() {
    var html = '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.line + ';border-radius:12px;padding:12px">';

      html += '<div class="mono" style="font-size:10px;color:' + C.muted + ';margin-bottom:8px">Leído del servidor a las ' + fmtExact(state.playersRefreshedAt) + '</div>';

  function getLateCancellations(type) {
    return (state.sessions[type] || []).filter(function (c) {
      return c.cancelled && c.late;
    }).sort(function (a, b) { return b.cancelledTs - a.cancelledTs; });
  }

  function fmtFull(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }) +
      ", " + d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

    html += '</div>';

      html += '<div style="margin-bottom:' + (i < draft.groups.length - 1 ? "10px" : "0") + '">';
      html += '<div style="font-size:12px;font-weight:600">' + esc(g.label) + '</div>';
      html += '<div class="mono" style="font-size:10px;color:' + C.muted + ';margin-bottom:4px">' + esc(g.email) + '</div>';
      html += '<input value="' + esc(g.playersText) + '" oninput="AppActions.setPayOverrideGroup(' + i + ',this.value)" placeholder="Nombres separados por coma" style="width:100%;box-sizing:border-box;padding:7px 9px;border-radius:7px;border:1px solid ' + C.line + ';background:' + C.panel2 + ';color:' + C.text + ';font-size:12.5px">';
      html += '</div>';
    });
    html += '</div>';

    html += '<button onclick="AppActions.savePayOverride(\'' + occKey + '\')" style="flex:1;padding:9px;border-radius:8px;border:none;background:' + C.accent + ';color:' + C.bg + ';font-weight:700;font-size:12.5px;cursor:pointer">Guardar pagos</button>';
    html += '</div>';

      html += '<div style="color:' + C.muted + ';font-size:13px;padding:14px;text-align:center;background:' + C.panel + ';border-radius:12px;margin-bottom:20px">Nadie tiene una bajada pendiente ahorita.</div>';
    } else {
      html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.danger + ';border-radius:12px;overflow:hidden;margin-bottom:20px">';
      pending.forEach(function (r, i) {
        var courtNote = r.pendingDropFromCourt ? "bajó de Cancha " + esc(r.pendingDropFromCourt) : "bajada registrada antes de tener el dato de cancha";

  function renderLateCancellations() {

    var wedLate = getLateCancellations("miercoles");

      html += '<div style="color:' + C.muted + ';font-size:13px;padding:14px;text-align:center;background:' + C.panel + ';border-radius:12px;border:1px solid ' + C.line + '">Ninguna cancelación fuera de tiempo por ahora.</div>';
      return html;
    }
    html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.danger + ';border-radius:12px;overflow:hidden">';

      html += '<div style="padding:10px 12px;' + (i < all.length - 1 ? "border-bottom:1px solid " + C.line : "") + '">';

      html += '<div style="font-size:11.5px;color:' + C.text + ';margin-top:5px">' + m.label + ' — canceló el <span class="mono">' + fmtFull(item.c.cancelledTs) + '</span></div>';

      html += '<button onclick="AppActions.resolveLateCancellation(\'' + item.c._id + '\',\'' + item.type + '\')" style="margin-top:6px;font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid ' + C.good + ';background:transparent;color:' + C.good + ';cursor:pointer">✓ ya resuelta, quitar</button>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderResultsPanel() {
    var html = '<div class="hd" style="font-size:16px;margin:20px 0 8px">Resultados de la semana</div>';
    html += '<div style="display:flex;gap:8px;margin-bottom:12px">';
    ["lunes", "miercoles"].forEach(function (dtype) {
      var on = state.resultsType === dtype;
      html += '<button onclick="AppActions.setResultsType(\'' + dtype + '\')" style="flex:1;padding:8px;border-radius:8px;border:1px solid ' + (on ? C.accent : C.line) + ';background:' + (on ? C.panel2 : "transparent") + ';color:' + (on ? C.accent : C.muted) + ';font-weight:600;font-size:12.5px;cursor:pointer">' + (dtype === "lunes" ? "Lunes · Court X" : "Miércoles · The District") + '</button>';
    });
    html += '</div>';

    if (!state.resultsOccurrence) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:16px;text-align:center;background:' + C.panel + ';border-radius:12px">Cargando...</div>';
      return html;
    }

    html += '<div class="mono" style="font-size:11px;color:' + C.muted + ';margin-bottom:10px">Jornada del ' + fmtShort(state.resultsOccurrence.date) + '</div>';

    if (!state.resultsCourts || !state.resultsCourts.length) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:16px;text-align:center;background:' + C.panel + ';border-radius:12px">No hay confirmados registrados todavía para esta jornada.</div>';
      return html;
    }

    if (state.resultsSavedAt && !state.resultsClosed) {
      html += '<div style="font-size:11.5px;color:' + C.good + ';margin-bottom:8px">✓ Guardado ' + fmtDT(new Date(state.resultsSavedAt)) + '</div>';
    }

    if (state.resultsClosed) {
      html += '<div style="background:' + C.panel2 + ';border:1px solid ' + C.good + ';border-radius:10px;padding:10px 12px;margin-bottom:12px">';
      html += '<div style="font-size:12.5px;color:' + C.good + ';font-weight:600">🔒 Resultados confirmados y ranking actualizado</div>';
      html += '<div class="mono" style="font-size:10.5px;color:' + C.muted + ';margin-top:2px">cerrado ' + fmtExact(state.resultsClosedAt) + '</div>';
      html += '<button onclick="AppActions.reopenResults()" style="margin-top:6px;font-size:10.5px;padding:4px 9px;border-radius:6px;border:1px solid ' + C.line + ';background:transparent;color:' + C.muted + ';cursor:pointer">🔓 Reabrir para corregir</button>';
      html += '</div>';
    } else {
      html += '<div style="font-size:12px;color:' + C.muted + ';margin-bottom:12px">Toca a los jugadores en el orden en que terminaron: primer toque = 1°, segundo = 2°... Toca de nuevo para quitar.</div>';
    }

    var badgeColor = { 1: C.accent, 2: C.accent2, 3: "#8C97B3", 4: C.danger };
    var badgeLabel = { 1: "🥇 1°", 2: "🥈 2°", 3: "🥉 3°", 4: "💩 4°" };

    state.resultsCourts.forEach(function (court, ci) {
      var pending = court.length < 4;
      var done = !pending && court.every(function (p) { return p.position; });
      html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + (done ? C.good : C.line) + ';border-radius:12px;padding:12px;margin-bottom:10px;' + (pending ? "opacity:0.55" : "") + (state.resultsClosed ? "opacity:0.7" : "") + '">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
      html += '<div class="hd mono" style="font-size:12.5px;color:' + C.accent + '">CANCHA ' + String.fromCharCode(65 + ci) + '</div>';
      if (pending) html += '<span style="font-size:9.5px;color:#F2C94C;border:1px dashed #F2C94C;padding:2px 6px;border-radius:20px;font-weight:600">pendiente de completar</span>';
      else if (done) html += '<span style="font-size:11px;color:' + C.good + '">✓ completa</span>';
      html += '</div>';
      court.forEach(function (p, pi) {
        if (pending || state.resultsClosed) {
          var closedBadge = (state.resultsClosed && p.position) ? '<span style="font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:' + badgeColor[p.position] + ';color:' + C.bg + '">' + badgeLabel[p.position] + '</span>' : '<span class="mono" style="color:' + C.muted + '">—</span>';
          html += '<div style="display:flex;justify-content:space-between;padding:9px 8px;font-size:13.5px"><span>' + esc(p.name) + '</span>' + closedBadge + '</div>';
          return;
        }
        var badge = p.position ? '<span style="font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:' + badgeColor[p.position] + ';color:' + C.bg + '">' + badgeLabel[p.position] + '</span>' : '<span style="font-size:11.5px;color:' + C.muted + ';padding:4px 9px;border-radius:20px;border:1px dashed ' + C.line + '">toca aquí</span>';
        html += '<div onclick="AppActions.tapPosition(' + ci + ',' + pi + ')" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 8px;font-size:13.5px;cursor:pointer;border-radius:8px;margin-bottom:2px;background:' + (p.position ? "rgba(255,255,255,0.03)" : "transparent") + '">';
        html += '<span>' + esc(p.name) + '</span>' + badge + '</div>';
      });
      if (!pending && !state.resultsClosed) {
        html += renderSetCaptureBlock("admin_" + ci, court, state.resultsGames[ci], "AppActions.setAdminSetScore(" + ci, "AppActions.calcAdminFromSets(" + ci + ")");
      }
      if (pending) {
        html += '<div style="font-size:10.5px;color:#F2C94C;margin-top:6px">Faltan ' + (4 - court.length) + ' para completar la cancha</div>';
      } else if (!state.resultsClosed && court.some(function (p) { return p.position; })) {
        html += '<button onclick="AppActions.clearCourt(' + ci + ')" style="margin-top:6px;font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid ' + C.line + ';background:transparent;color:' + C.muted + ';cursor:pointer">Limpiar cancha</button>';
      }
      html += '</div>';
    });

    if (!state.resultsClosed) {
      var anyPicked = state.resultsCourts.some(function (court) { return court.some(function (p) { return p.position; }); });
      var allComplete = state.resultsCourts.every(function (court) { return court.length < 4 || court.every(function (p) { return p.position; }); });
      html += '<button onclick="AppActions.saveResults()" style="width:100%;padding:10px;border-radius:9px;border:1px solid ' + C.line + ';background:transparent;color:' + C.text + ';font-weight:600;font-size:13px;cursor:pointer;margin-bottom:8px">Guardar avance</button>';
      html += '<button onclick="AppActions.confirmResultsWeek()" ' + (anyPicked ? "" : "disabled") + ' class="glow" style="width:100%;padding:12px;border-radius:9px;border:none;background:' + (anyPicked ? C.accent : C.line) + ';color:' + (anyPicked ? C.bg : C.muted) + ';font-weight:700;font-size:13.5px;cursor:' + (anyPicked ? "pointer" : "default") + '">✅ Confirmar resultados de la semana</button>';
      if (!allComplete) html += '<div style="font-size:10.5px;color:' + C.muted + ';margin-top:6px;text-align:center">Las canchas incompletas se ignoran al confirmar — no afectan el ranking.</div>';
    }
    return html;
  }

  function phoneEmail(phone) { return normalizePhone(phone) + "@unionpadel.app"; }

  function loadSessionData(type) {
    var m = metas()[type];
    return fetchConfirmations(type, m.key);
  }
  function loadAllSessions() {
    return Promise.all([loadSessionData("lunes"), loadSessionData("miercoles")]).then(function (r) {
      state.sessions = { lunes: r[0], miercoles: r[1] };
    });
  }
  function fetchPlayerWithRetry(id, attempt) {
    return sb.from("players").select("*").eq("id", id).maybeSingle().then(function (pres) {
      if (!pres.error && !pres.data && (attempt || 0) < 5) {
        return new Promise(function (resolve) { setTimeout(resolve, 700); }).then(function () {
          return fetchPlayerWithRetry(id, (attempt || 0) + 1);
        });
      }
      return pres;
    });
  }

  function ensureRankingEntry(name) {
    var list = (state.ranking && state.ranking.list ? state.ranking.list : []);
    if (list.some(function (r) { return normalizeName(r.name) === normalizeName(name); })) {
      return Promise.resolve();
    }
    var maxRank = list.reduce(function (m, r) { return Math.max(m, r.rank); }, 0);
    return sb.from("ranking").insert({ name: name, rank: maxRank + 1 }).then(function (res) {
      if (res.error) { console.error("No se pudo crear ranking automático:", res.error); return; }
      return fetchRanking().then(function (r) { state.ranking = r; });
    });
  }

  function claimManualConfirmations(player) {
    var myName = normalizeName(player.name);
    return sb.from("confirmations").select("id,player_name").is("player_id", null).then(function (res) {
      if (!res.data || !res.data.length) return;
      var mine = res.data.filter(function (r) { return normalizeName(r.player_name) === myName; });
      return Promise.all(mine.map(function (r) {
        return sb.from("confirmations").update({ player_id: player.id }).eq("id", r.id);
      }));
    });
  }

  function patchAuthSubmitButton() {
    var btn = document.getElementById("auth-submit-btn");
    if (!btn) return;
    var phone = normalizePhone(state.loginPhone);
    var pw = state.loginPassword;
    var canSubmit = state.authMode === "signup"
      ? (!!phone && state.loginName.trim().length > 0 && pw.length >= 6 && !state.loggingIn)
      : (!!phone && pw.length > 0 && !state.loggingIn);
    btn.disabled = !canSubmit;
    btn.style.background = canSubmit ? C.accent : C.line;
    btn.style.color = canSubmit ? C.bg : C.muted;
    btn.style.cursor = canSubmit ? "pointer" : "default";
  }
  function patchPasswordField() {
    var input = document.getElementById("password-input");
    var hint = document.getElementById("pw-hint");
    var pw = state.loginPassword;
    var ok = pw.length >= 6;
    if (input && state.authMode === "signup") {
      input.style.borderColor = pw ? (ok ? C.good : C.danger) : C.line;
    }
    if (hint) hint.style.display = (pw && !ok) ? "block" : "none";
    patchAuthSubmitButton();
  }

  window.AppActions = {
    setPhone: function (v) { state.loginPhone = v; state.loginError = ""; patchAuthSubmitButton(); },
    setName: function (v) { state.loginName = v; state.loginError = ""; render(); },
    setEmail: function (v) { state.loginEmail = v; render(); },
    setPassword: function (v) { state.loginPassword = v; state.loginError = ""; patchPasswordField(); },
    togglePasswordVisibility: function () { state.showPassword = !state.showPassword; render(); },
    pickName: function (n) { state.loginName = n; render(); },
    setAuthMode: function (m) { state.authMode = m; state.loginError = ""; render(); },
    login: function () {
      var phone = normalizePhone(state.loginPhone);
      var password = state.loginPassword;
      state.loginError = "";
      if (!phone) { state.loginError = "Ingresa tu teléfono para continuar."; render(); return; }
      if (!password) { state.loginError = "Ingresa tu contraseña."; render(); return; }
      state.loggingIn = true; render();
      sb.auth.signInWithPassword({ email: phoneEmail(phone), password: password }).then(function (res) {
        if (res.error) {
          state.loginError = "Teléfono o contraseña incorrectos.";
          state.loggingIn = false; render(); return;
        }
        var authUser = res.data.user;
        return fetchPlayerWithRetry(authUser.id).then(function (pres) {
          if (pres.error) {
            state.loginError = "Hubo un problema cargando tu perfil. Intenta de nuevo.";
            state.loggingIn = false; render(); return;
          }
          if (!pres.data) {
            state.pendingProfileUser = { id: authUser.id, phone: phone };
            state.loggingIn = false; render(); return;
          }
          state.player = pres.data; state.isAdmin = !!pres.data.is_admin;
          state.loggingIn = false; state.tab = "inicio"; render();
          claimManualConfirmations(pres.data).then(function () { loadAllSessions().then(render); });
        });
      });
    },
    completeProfile: function () {
      var name = state.loginName.trim();
      state.loginError = "";
      if (!name) { state.loginError = "Escribe tu nombre."; render(); return; }
      var pu = state.pendingProfileUser;
      state.loggingIn = true; render();
      sb.from("players").insert({ id: pu.id, name: name, phone: pu.phone, email: state.loginEmail.trim() || null }).select().single().then(function (pres) {
        if (pres.error) {
          if (pres.error.message && pres.error.message.indexOf("players_pkey") !== -1) {
            sb.from("players").select("*").eq("id", pu.id).single().then(function (existing) {
              if (existing.error || !existing.data) {
                state.loginError = "Algo falló: " + pres.error.message;
                state.loggingIn = false; render(); return;
              }
              state.player = existing.data; state.isAdmin = !!existing.data.is_admin; state.pendingProfileUser = null;
              state.loggingIn = false; state.tab = "inicio"; render();
              ensureRankingEntry(existing.data.name).then(function () {
                claimManualConfirmations(existing.data).then(function () { loadAllSessions().then(render); });
              });
            });
            return;
          }
          state.loginError = "Algo falló: " + pres.error.message;
          state.loggingIn = false; render(); return;
        }
        state.player = pres.data; state.isAdmin = false; state.pendingProfileUser = null;
        state.loggingIn = false; state.tab = "inicio"; render();
        ensureRankingEntry(pres.data.name).then(function () {
          claimManualConfirmations(pres.data).then(function () { loadAllSessions().then(render); });
        });
      });
    },
    signup: function () {
      var phone = normalizePhone(state.loginPhone);
      var name = state.loginName.trim();
      var password = state.loginPassword;
      state.loginError = "";
      if (!phone) { state.loginError = "Ingresa tu teléfono."; render(); return; }
      if (!name) { state.loginError = "Escribe tu nombre."; render(); return; }
      if (password.length < 6) { state.loginError = "La contraseña debe tener al menos 6 caracteres."; render(); return; }

      state.loggingIn = true; render();
      sb.auth.signUp({ email: phoneEmail(phone), password: password }).then(function (res) {
        if (res.error) {
          state.loginError = res.error.message.indexOf("registered") !== -1
            ? "Ya existe una cuenta con ese teléfono. Inicia sesión en vez de registrarte."
            : "Algo falló: " + res.error.message;
          state.loggingIn = false; render(); return;
        }
        var uid = res.data.user.id;
        return sb.from("players").insert({ id: uid, name: name, phone: phone, email: state.loginEmail.trim() || null }).select().single().then(function (pres) {
          if (pres.error) {
            state.loginError = "Tu cuenta se creó pero hubo un problema guardando tus datos: " + pres.error.message;
            state.loggingIn = false; render(); return;
          }
          state.player = pres.data; state.isAdmin = false;
          state.loggingIn = false; state.tab = "inicio"; render();
          ensureRankingEntry(pres.data.name).then(function () {
            claimManualConfirmations(pres.data).then(function () { loadAllSessions().then(render); });
          });
        });
      });
    },
    viewProfile: function (name) {
      var isMe = state.player && normalizeName(name) === normalizeName(state.player.name);
      var rankEntry = state.ranking && state.ranking.list ? state.ranking.list.filter(function (r) { return normalizeName(r.name) === normalizeName(name); })[0] : null;
      state.profileModal = {
        name: name, loading: true, isMe: isMe,
        rank: rankEntry ? rankEntry.rank : null, previousRank: rankEntry ? rankEntry.previousRank : null,
        avatarEmoji: null, avatarImage: null, results: [], history: [], streak: null, biggestJump: null
      };
      state.simResult = null; state.h2hQuery = ""; state.h2hResult = null;
      render();
      var avatarPromise = isMe
        ? Promise.resolve({ data: [{ avatar: state.player.avatar, avatar_image: state.player.avatar_image }] })
        : sb.rpc("get_player_card_info", { p_name: name });
      Promise.all([fetchResultsByName(name, 15), fetchRankingHistory(name), avatarPromise]).then(function (r) {
        if (!state.profileModal || normalizeName(state.profileModal.name) !== normalizeName(name)) return;
        var avatarRow = (!r[2].error && r[2].data && r[2].data[0]) || {};
        state.profileModal.loading = false;
        state.profileModal.results = r[0];
        state.profileModal.history = r[1];
        state.profileModal.streak = computeStreak(r[0]);
        state.profileModal.biggestJump = computeBiggestJump(r[1]);
        state.profileModal.avatarImage = avatarRow.avatar_image || null;
        state.profileModal.avatarEmoji = (AVATAR_OPTIONS.filter(function (a) { return a.id === avatarRow.avatar; })[0] || {}).emoji || null;
        render();
      });
    },
    closeProfile: function () {
      state.profileModal = null; state.simResult = null; state.h2hQuery = ""; state.h2hResult = null;
      render();
    },
    runSimulation: function () {
      var found = getMyCurrentCourt();
      if (!found) { state.simResult = { error: true }; render(); return; }
      var winRank = simulateResultRank(state.player.name, 1, found.court);
      var loseRank = simulateResultRank(state.player.name, 4, found.court);
      state.simResult = { winRank: winRank, loseRank: loseRank, type: found.type, courtSize: found.court.length };
      render();
    },
    setH2hQuery: function (v) { state.h2hQuery = v; render(); },
    compareHeadToHead: function (oppName) {
      state.h2hQuery = oppName;
      state.h2hResult = { name: oppName, loading: true };
      render();
      fetchRankingHistory(oppName).then(function (hist) {
        if (!state.h2hResult || normalizeName(state.h2hResult.name) !== normalizeName(oppName)) return;
        var entry = state.ranking && state.ranking.list ? state.ranking.list.filter(function (r) { return normalizeName(r.name) === normalizeName(oppName); })[0] : null;
        state.h2hResult.loading = false;
        state.h2hResult.history = hist;
        state.h2hResult.rank = entry ? entry.rank : null;
        render();
      });
    },
    toggleLang: function () {
      state.lang = state.lang === "en" ? "es" : "en";
      try { localStorage.setItem("unionpadel_lang", state.lang); } catch (e) {}
      render();
    },
    logout: function () {
      sb.auth.signOut().then(function () {
        state.player = null; state.isAdmin = false; state.loginPhone = ""; state.loginName = ""; state.loginEmail = ""; state.loginPassword = ""; state.authMode = "login";
        render();
      });
    },
    setTab: function (t) {
      state.tab = t;
      if (t === "ranking") state.rankingScrolled = false;
      if (t === "canchas") {
        var m = metas();
        state.courtTab = m.lunes.date <= m.miercoles.date ? "lunes" : "miercoles";
      }
      if (t === "admin" && !state.resultsOccurrence) AppActions.loadResults();
      if (t === "perfil" && !state.myResultsLoaded) {
        fetchMyResults(state.player.id).then(function (r) { state.myResults = r; state.myResultsLoaded = true; render(); });
      }
      if (t === "perfil" && !state.myHistoryLoaded) {
        fetchRankingHistory(state.player.name).then(function (r) { state.myHistory = r; state.myHistoryLoaded = true; render(); });
      }
      render();
    },
    jumpToMe: function () {
      var box = document.getElementById("ranking-scroll");
      var mine = document.getElementById("my-rank-row");
      if (box && mine) box.scrollTop = mine.offsetTop - box.clientHeight / 2 + mine.offsetHeight / 2;
    },

    uploadAvatarImage: function (file) {

      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var size = 200;
          var canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext("2d");
          var side = Math.min(img.width, img.height);
          var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          var dataUrl = canvas.toDataURL("image/jpeg", 0.72);

        };
        img.onerror = function () { window.alert("No se pudo leer esa imagen."); };
        img.src = ev.target.result;
      };
      reader.onerror = function () { window.alert("No se pudo leer el archivo."); };
      reader.readAsDataURL(file);

      var m = metas()[type];
      if (state.now > m.cancelDeadline) {
        window.alert("Ya pasó el límite de cancelación de " + m.label + " (" + fmtDT(m.cancelDeadline) + ").\n\nContacta directamente a un administrador (Pablo Cuevas o Mauricio Caso) para organizar tu lugar.");
        return;
      }
      if (!window.confirm("¿Estás seguro que deseas cancelar tu lugar en " + m.label + "?")) return;
      var myName = normalizeName(state.player.name);
      sb.from("confirmations").select("id,cancelled,player_id,player_name").eq("session_type", type).eq("session_date", m.key).then(function (res) {
        var rows = res.data || [];
        var mine = rows.filter(function (r) { return !r.cancelled && r.player_id === state.player.id; })[0];
        if (!mine) mine = rows.filter(function (r) { return !r.cancelled && !r.player_id && normalizeName(r.player_name) === myName; })[0];
        if (!mine) return;
        sb.from("confirmations").update({
          cancelled: true, cancelled_at: new Date().toISOString(), late_cancellation: false
        }).eq("id", mine.id).then(function () {
          loadSessionData(type).then(function (list) { state.sessions[type] = list; render(); });
        });
      });
    },
    adminCancel: function (confId) {
      var type = state.adminSessionTab, m = metas()[type];
      var late = state.now > m.cancelDeadline;
      sb.from("confirmations").update({ cancelled: true, cancelled_at: new Date().toISOString(), late_cancellation: late })
      .eq("id", confId).eq("cancelled", false)
      .then(function () {
        loadSessionData(type).then(function (list) { state.sessions[type] = list; render(); });
      });
    },
    togglePaid: function (confId) {
      var type = state.adminSessionTab;
      var current = (state.sessions[type] || []).filter(function (c) { return c._id === confId; })[0];
      sb.from("confirmations").update({ paid: !(current && current.paid) })
      .eq("id", confId)
      .then(function () {
        loadSessionData(type).then(function (list) { state.sessions[type] = list; render(); });
      });
    },
    setManualName: function (v) { state.manualName = v; state.manualError = ""; render(); },
    addManualConfirmation: function () {
      var name = state.manualName.trim();
      if (!name) { state.manualError = "Escribe un nombre."; render(); return; }
      var type = state.adminSessionTab, m = metas()[type];
      sb.from("players").select("id,name").ilike("name", name).then(function (pres) {
        var match = (pres.data || []).filter(function (p) { return normalizeName(p.name) === normalizeName(name); })[0];
        var existingQuery = sb.from("confirmations").select("id,cancelled").eq("session_type", type).eq("session_date", m.key);
        existingQuery = match ? existingQuery.eq("player_id", match.id) : existingQuery.is("player_id", null).eq("player_name", name);

        existingQuery.then(function (eres) {
          var exist = (eres.data || [])[0];
          var op;
          if (exist) {
            if (!exist.cancelled) {
              state.manualError = "Esa persona ya está confirmada en esta sesión.";
              render(); return;
            }
            op = sb.from("confirmations").update({
              cancelled: false, cancelled_at: null, late_cancellation: false,
              confirmed_at: new Date().toISOString(), rank_at_confirm: findRank(name)
            }).eq("id", exist.id);
          } else {
            op = sb.from("confirmations").insert({
              session_type: type, session_date: m.key, player_id: match ? match.id : null,
              player_name: name, rank_at_confirm: findRank(name)
            });
          }
          op.then(function (res) {
            if (res.error) { state.manualError = "Algo falló: " + res.error.message; render(); return; }
            state.manualName = ""; state.manualError = "";
            loadSessionData(type).then(function (list) { state.sessions[type] = list; render(); });
          });
        });
      });
    },
    linkConfirmation: function (confId, name) {
      sb.from("players").select("id,name").ilike("name", name).then(function (pres) {
        var match = (pres.data || []).filter(function (p) { return normalizeName(p.name) === normalizeName(name); })[0];
        if (!match) { window.alert("No encontré ninguna cuenta registrada con el nombre \"" + name + "\". Revisa la Base de datos de jugadores para ver el nombre exacto con el que se registró."); return; }
        var type = state.adminSessionTab;
        var m = metas()[type];
        sb.from("confirmations").select("id").eq("session_type", type).eq("session_date", m.key).eq("player_id", match.id).then(function (existRes) {
          var existing = (existRes.data || [])[0];
          if (existing) {
            sb.from("confirmations").delete().eq("id", confId).then(function (res) {
              if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
              window.alert(name + " ya tenía su propia confirmación para esta sesión — quité la entrada duplicada sin cuenta.");
              loadSessionData(type).then(function (list) { state.sessions[type] = list; render(); });
            });
            return;
          }
          sb.from("confirmations").update({ player_id: match.id }).eq("id", confId).then(function (res) {
            if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
            loadSessionData(type).then(function (list) { state.sessions[type] = list; render(); });
          });
        });
      });
    },
    editManualName: function (confId, currentName) {
      var name = window.prompt("Editar nombre:", currentName);
      if (name === null) return;
      name = name.trim();
      if (!name) return;
      var type = state.adminSessionTab;
      sb.from("confirmations").update({ player_name: name, rank_at_confirm: findRank(name) }).eq("id", confId).then(function (res) {
        if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
        loadSessionData(type).then(function (list) { state.sessions[type] = list; render(); });
      });
    },
    setResultsType: function (t) {
      state.resultsType = t;
      AppActions.loadResults();
    },
    setNewPlayerName: function (v) { state.newPlayerName = v; state.newPlayerError = ""; render(); },
    addNewPlayer: function () {
      var name = state.newPlayerName.trim();
      if (!name) { state.newPlayerError = "Escribe un nombre."; render(); return; }
      var list = (state.ranking && state.ranking.list ? state.ranking.list.slice() : []);
      if (list.some(function (r) { return normalizeName(r.name) === normalizeName(name); })) {
        state.newPlayerError = "Ya existe alguien con ese nombre en el ranking.";
        render(); return;
      }
      var maxRank = list.reduce(function (m, r) { return Math.max(m, r.rank); }, 0);
      sb.from("ranking").insert({ name: name, rank: maxRank + 1 }).then(function (res) {
        if (res.error) { state.newPlayerError = "Algo falló: " + res.error.message; render(); return; }
        state.newPlayerName = ""; state.newPlayerError = ""; state.newPlayerAddedAt = Date.now();
        fetchRanking().then(function (r) { state.ranking = r; render(); });
      });
    },
    refreshRanking: function () {
      fetchRanking().then(function (r) { state.ranking = r; render(); });
    },
    togglePublicResults: function () {
      state.showPublicResults = !state.showPublicResults;
      if (state.showPublicResults && !state.publicResultsLoaded) AppActions.loadPublicResults();
      render();
    },
    setPublicResultsType: function (t) {
      state.publicResultsType = t;
      AppActions.loadPublicResults();
    },
    loadPublicResults: function () {
      var type = state.publicResultsType;
      var occ = pastOccurrences(type, 1)[0];
      state.publicResultsOccurrence = occ;
      state.publicResultsLoaded = false;
      state.publicResultsCourts = null;
      render();
      Promise.all([
        sb.from("results_closed").select("*").eq("session_type", type).eq("session_date", occ.key).maybeSingle(),
        fetchConfirmations(type, occ.key),
        sb.from("results").select("*").eq("session_type", type).eq("session_date", occ.key)
      ]).then(function (r) {
        state.publicResultsClosed = !!(r[0] && r[0].data);
        if (state.publicResultsClosed) {
          var active = orderActive(r[1].filter(function (c) { return !c.cancelled; }));
          var confirmed = active.slice(0, capacityFor(type, occ.key));
          var freshCourts = buildCourts(confirmed);
          var savedRows = (r[2] && r[2].data) || [];
          var courts;
          if (savedRows.length) {
            var byCourtIndex = {};
            savedRows.forEach(function (row) {
              byCourtIndex[row.court_index] = byCourtIndex[row.court_index] || [];
              byCourtIndex[row.court_index].push({
                name: row.player_name, playerId: row.player_id, position: row.position,
                rank: findRank(row.player_name), ts: 0
              });
            });
            var maxIdx = Math.max(freshCourts.length - 1, Math.max.apply(null, Object.keys(byCourtIndex).map(Number)));
            courts = [];
            for (var ci = 0; ci <= maxIdx; ci++) {
              var c = byCourtIndex[ci] || freshCourts[ci] || [];
              c = c.slice().sort(function (a, b) { return (a.position || 99) - (b.position || 99); });
              courts.push(c);
            }
          } else {
            courts = freshCourts;
          }
          state.publicResultsCourts = courts;
        }
        state.publicResultsLoaded = true;
        render();
      });
    },
    refreshSessions: function () {
      loadAllSessions().then(render);
    },
    adminResetPassword: function (phone, name) {
      var sure = window.confirm("Se le va a generar una contraseña temporal nueva a " + name + " y se cierra su sesión actual. ¿Continuar?");
      if (!sure) return;
      var chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
      var pw = "";
      for (var i = 0; i < 8; i++) pw += chars.charAt(Math.floor(Math.random() * chars.length));
      sb.rpc("admin_reset_password", { target_phone: normalizePhone(phone), new_password: pw }).then(function (res) {
        if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
        window.alert("Contraseña temporal para " + name + ":\n\n" + pw + "\n\nCompártesela para que entre — en cuanto inicie sesión, puede cambiarla por una propia desde Perfil → Cambiar contraseña.");
      });
    },
    refreshPlayers: function () {
      fetchAllPlayers().then(function (players) {
        state.allPlayers = players || [];
        state.playersRefreshedAt = Date.now();
        render();
      });
    },
    loadResults: function () {
      var type = state.resultsType;
      var occ = pastOccurrences(type, 1)[0];
      state.resultsOccurrence = occ; state.resultsCourts = null; state.resultsSavedAt = null; state.resultsClosed = false; state.resultsClosedAt = null; state.resultsGames = {}; render();
      Promise.all([
        fetchConfirmations(type, occ.key),
        sb.from("results").select("*").eq("session_type", type).eq("session_date", occ.key),
        sb.from("results_closed").select("*").eq("session_type", type).eq("session_date", occ.key).maybeSingle()
      ]).then(function (r) {
        var confirmations = orderActive(r[0].filter(function (c) { return !c.cancelled; })).slice(0, capacityFor(type, occ.key));
        var freshCourts = buildCourts(confirmations);
        var savedRows = (r[1] && r[1].data) || [];
        var courts;
        if (savedRows.length) {
          var byCourtIndex = {};
          savedRows.forEach(function (row) {
            byCourtIndex[row.court_index] = byCourtIndex[row.court_index] || [];
            byCourtIndex[row.court_index].push({
              name: row.player_name, playerId: row.player_id, position: row.position,
              rank: findRank(row.player_name), ts: 0
            });
          });
          var maxIdx = Math.max(freshCourts.length - 1, Math.max.apply(null, Object.keys(byCourtIndex).map(Number)));
          courts = [];
          for (var ci = 0; ci <= maxIdx; ci++) {
            var c = byCourtIndex[ci] || freshCourts[ci] || [];
            c = c.slice().sort(function (a, b) { return (a.position || 99) - (b.position || 99); });
            courts.push(c);
          }
          state.resultsSavedAt = new Date(savedRows[0].saved_at).getTime();
        } else {
          courts = freshCourts;
        }
        if (r[2] && r[2].data) { state.resultsClosed = true; state.resultsClosedAt = new Date(r[2].data.closed_at).getTime(); }
        state.resultsCourts = courts; render();
      });
    },
    confirmResultsWeek: function () {
      var occ = state.resultsOccurrence;
      var type = state.resultsType;
      var sure = window.confirm("Esto va a cerrar los resultados de " + (type === "lunes" ? "Lunes" : "Miércoles") + " del " + fmtShort(occ.date) + " y actualizar el ranking. Después de confirmar, tendrás que reabrir manualmente si necesitas corregir algo.\n\n¿Confirmar?");
      if (!sure) return;
      var rows = [];
      state.resultsCourts.forEach(function (court, ci) {
        court.forEach(function (p) {
          if (!p.position) return;
          rows.push({
            session_type: type, session_date: occ.key, court_index: ci,
            player_id: p.playerId, player_name: p.name, position: p.position,
            saved_at: new Date().toISOString()
          });
        });
      });
      sb.from("results").upsert(rows, { onConflict: "session_type,session_date,court_index,player_id" }).then(function (res) {
        if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
        applyResultsToRanking(state.resultsCourts, type, occ.key).then(function () {
          return sb.from("results_closed").upsert({ session_type: type, session_date: occ.key, closed_at: new Date().toISOString() }, { onConflict: "session_type,session_date" });
        }).then(function () {
          state.resultsSavedAt = Date.now(); state.resultsClosed = true; state.resultsClosedAt = Date.now();
          fetchRanking().then(function (r) { state.ranking = r; render(); });
        }).catch(function (err) {
          window.alert(err.message + "\n\nLos resultados de las canchas sí quedaron guardados, pero el ranking NO se movió — puedes corregir el problema y volver a darle 'Confirmar resultados de la semana'.");
        });
      });
    },
    reopenResults: function () {
      var occ = state.resultsOccurrence;
      var type = state.resultsType;
      sb.from("results_closed").delete().eq("session_type", type).eq("session_date", occ.key).then(function (res) {
        if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
        state.resultsClosed = false; state.resultsClosedAt = null; render();
      });
    },
    tapPosition: function (ci, pi) {
      var court = state.resultsCourts[ci];
      var player = court[pi];
      if (player.position) {
        player.position = null;
      } else {
        var used = court.map(function (p) { return p.position; }).filter(Boolean);
        var next = [1, 2, 3, 4].filter(function (n) { return used.indexOf(n) === -1; })[0];
        player.position = next || null;
      }
      render();
    },
    clearCourt: function (ci) {
      state.resultsCourts[ci].forEach(function (p) { p.position = null; });
      render();
    },
    saveResults: function () {
      var occ = state.resultsOccurrence;
      var type = state.resultsType;
      var rows = [];
      state.resultsCourts.forEach(function (court, ci) {
        court.forEach(function (p) {
          if (!p.position) return;
          rows.push({
            session_type: type, session_date: occ.key, court_index: ci,
            player_id: p.playerId, player_name: p.name, position: p.position,
            saved_at: new Date().toISOString()
          });
        });
      });
      sb.from("results").upsert(rows, { onConflict: "session_type,session_date,court_index,player_id" }).then(function (res) {
        if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
        state.resultsSavedAt = Date.now(); render();
      });
    }
  };

  function setupRealtime() {
    var rankingTimer = null, confirmTimer = null, resultsTimer = null;

    sb.channel("rt-ranking")
      .on("postgres_changes", { event: "*", schema: "public", table: "ranking" }, function () {
        clearTimeout(rankingTimer);
        rankingTimer = setTimeout(function () {
          fetchRanking().then(function (r) { state.ranking = r; render(); });
        }, 400);
      })
      .subscribe();

    sb.channel("rt-confirmations")
      .on("postgres_changes", { event: "*", schema: "public", table: "confirmations" }, function () {
        clearTimeout(confirmTimer);
        confirmTimer = setTimeout(function () {
          state.canchasOverride = { lunes: null, miercoles: null };
          state.todayMatchCache = { lunes: null, miercoles: null };
          if (state.player) { loadAllSessions().then(render); } else { render(); }
        }, 400);
      })
      .subscribe();

    sb.channel("rt-results-closed")
      .on("postgres_changes", { event: "*", schema: "public", table: "results_closed" }, function () {
        clearTimeout(resultsTimer);
        resultsTimer = setTimeout(function () {
          state.publicResultsLoaded = false;
          Object.keys(state.selfCapture).forEach(function (k) { if (k.indexOf("_loading") === -1) state.selfCapture[k] = null; });
          if (state.showPublicResults) AppActions.loadPublicResults();
          render();
        }, 400);
      })
      .subscribe();

    sb.channel("rt-app-settings")
      .on("postgres_changes", { event: "*", schema: "public", table: "app_settings" }, function () {
        fetchAppSettings().then(function (s) { state.settings = s; render(); });
      })
      .subscribe();
  }

  function boot() {
    setInterval(function () { state.now = nowInToronto(); if (state.player && state.tab === "inicio") render(); }, 1000);
    setupRealtime();

    sb.auth.getSession().then(function (sres) {
      var session = sres.data.session;
      var playerPromise = session
        ? fetchPlayerWithRetry(session.user.id).then(function (r) { return r.data || null; })
        : Promise.resolve(null);

      Promise.all([fetchRanking(), playerPromise, fetchAppSettings()]).then(function (r) {
        state.ranking = r[0];
        state.player = r[1];
        state.isAdmin = !!(r[1] && r[1].is_admin);
        state.settings = r[2];
        if (session && !r[1]) {
          state.pendingProfileUser = { id: session.user.id, phone: (session.user.email || "").split("@")[0] };
        }
        var sessionsPromise = state.player ? loadAllSessions() : Promise.resolve();
        sessionsPromise.then(function () {
          state.loading = false;
          render();
        });
      });
    });

    render();
  }

  boot();
})();
</script>
</body>
</html>
