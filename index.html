<style>
  * { box-sizing: border-box; }

    background-image:
      radial-gradient(620px circle at 8% -8%, rgba(214,242,60,0.16), transparent 55%),
      radial-gradient(520px circle at 105% 4%, rgba(76,141,217,0.20), transparent 55%),
      radial-gradient(480px circle at 50% 115%, rgba(214,242,60,0.08), transparent 60%),
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 28px 28px, 28px 28px;
    background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat;
    background-attachment: fixed, fixed, fixed, scroll, scroll;
    width: 100%;
    height: 100%;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
  }
  #app { width: 100%; max-width: 100%; margin: 0 auto; height: 100%; display: flex; flex-direction: column;
    position: relative; background: rgba(10,15,24,0.35); backdrop-filter: blur(2px); overflow: hidden; }
  #chrome-mount { flex-shrink: 0; }
  #body-mount { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  input, textarea, select { font-family: inherit; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #2A3550; border-radius: 3px; }
  .hd { font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
  .card { position: relative; }
  .card::before, .card::after { content: ""; position: absolute; top: -1px; width: 9px; height: 9px; pointer-events: none; }
  .card::before { left: -1px; border-top: 2px solid #D6F23C; border-left: 2px solid #D6F23C; }
  .card::after { right: -1px; border-top: 2px solid #D6F23C; border-right: 2px solid #D6F23C; }
  .glow { box-shadow: 0 0 0 1px rgba(214,242,60,0.35), 0 6px 18px rgba(214,242,60,0.16); }
  .scan { height: 1px; background: linear-gradient(90deg, transparent, #2A3550 15%, #2A3550 85%, transparent); }
  .ball-bounce { animation: ballBounce 1.3s cubic-bezier(0.5,0,0.5,1) infinite; transform-origin: 50% 92%; }
  @keyframes ballBounce {
    0%   { transform: translateY(0) scaleX(1); }
    35%  { transform: translateY(-7px) scaleX(1); }
    55%  { transform: translateY(0) scaleX(1.06); }
    70%  { transform: translateY(-2px) scaleX(1); }
    100% { transform: translateY(0) scaleX(1); }
  }
  .racket-bg { position: absolute; pointer-events: none; opacity: 0.16; }
</style>

      originalDropCourt[e.name] = e.pendingDropFromCourt || null;
    });

    courts.forEach(function (court, ci) {
      if (court.length < 4) return;
      court.forEach(function (p) {
        if (!findEntry(p.name)) {
          var maxRank = list.reduce(function (m, r) { return Math.max(m, r.rank); }, 0);
          var fresh = { rank: maxRank + 1, name: p.name, pendingDropCount: 0, pendingDropFromCourt: null };

      var iterations = 0, changed = true;
      while (changed && iterations < 20) {
        changed = false;
        iterations++;
        for (var i = 0; i < entries.length; i++) {
          for (var j = i + 1; j < entries.length; j++) {
            if (entries[i].entry.rank > entries[j].entry.rank) {
              spliceGlobalRank(list, entries[i].entry, entries[j].entry.rank);

      var dropChanged = countBefore !== (entry.pendingDropCount || 0) || courtBefore !== (entry.pendingDropFromCourt || null);

  function fmtCountdown(target) {
    var diff = target - state.now;
    if (diff <= 0) return null;
    if (diff < 3 * 60000) {
      var secs = Math.ceil(diff / 1000);
      var m = Math.floor(secs / 60);
      var s = secs % 60;
      return m + "m " + (s < 10 ? "0" : "") + s + "s";
    }
    var totalMin = Math.floor(diff / 60000);
    var days = Math.floor(totalMin / 1440);
    var hours = Math.floor((totalMin % 1440) / 60);
    var mins = totalMin % 60;
    var parts = [];
    if (days > 0) parts.push(days + "d");
    if (days > 0 || hours > 0) parts.push(hours + "h");
    parts.push(mins + "m");
    return parts.join(" ");
  }

  function mySelfCaptureSlot(type) {
    var today = pastOccurrences(type, 1)[0];
    if (dateKey(state.now) !== today.key) return null;
    var unlockAt = new Date(today.date); unlockAt.setHours(21, 15, 0, 0);
    if (state.now < unlockAt) return null;
    var active = orderActive((state.sessions[type] || []).filter(function (c) { return !c.cancelled; }));
    var confirmed = active.slice(0, capacityFor(type));
    var courts = buildCourts(confirmed);
    var myName = normalizeName(state.player.name);
    var courtIndex = -1, posInCourt = -1;
    for (var ci = 0; ci < courts.length; ci++) {
      for (var pi = 0; pi < courts[ci].length; pi++) {
        if (courts[ci][pi].playerId === state.player.id || normalizeName(courts[ci][pi].name) === myName) {
          courtIndex = ci; posInCourt = pi; break;
        }
      }
      if (courtIndex !== -1) break;
    }
    if (courtIndex === -1 || courts[courtIndex].length < 4) return null;
    return { occ: today, court: courts[courtIndex], courtIndex: courtIndex };
  }

  function renderSelfCapture(type) {
    var slot = mySelfCaptureSlot(type);
    if (!slot) return "";
    var key = type + ":" + slot.occ.key + ":" + slot.courtIndex;
    if (!state.selfCapture[type] || state.selfCapture[type].key !== key) {
      if (state.selfCapture[type + "_loading"] !== key) {
        state.selfCapture[type + "_loading"] = key;
        AppActions.loadSelfCapture(type, slot);
      }
      return '<div style="margin-top:14px;color:' + C.muted + ';font-size:12.5px;text-align:center">Cargando tu cancha...</div>';
    }
    var sc = state.selfCapture[type];
    if (sc.closed) {
      return '<div style="margin-top:14px;padding:12px;background:' + C.panel + ';border:1px solid ' + C.good + ';border-radius:12px;font-size:12.5px;color:' + C.good + '">🔒 Los resultados de ' + metas()[type].label + ' de hoy ya fueron confirmados por un admin.</div>';
    }
    var badgeColor = { 1: C.accent, 2: C.accent2, 3: "#8C97B3", 4: C.danger };
    var badgeLabel = { 1: "🥇 1°", 2: "🥈 2°", 3: "🥉 3°", 4: "💩 4°" };

    html += '<div class="hd mono" style="font-size:13px;color:' + C.accent + ';margin-bottom:4px">📝 CAPTURA TU RESULTADO — CANCHA ' + String.fromCharCode(65 + slot.courtIndex) + '</div>';

    sc.court.forEach(function (p, pi) {

      html += '<div onclick="AppActions.tapSelfPosition(\'' + type + '\',' + pi + ')" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 8px;font-size:13.5px;cursor:pointer;border-radius:8px;margin-bottom:2px;background:' + (p.position ? "rgba(255,255,255,0.03)" : "transparent") + '"><span>' + esc(p.name) + '</span>' + badge + '</div>';
    });
    if (sc.savedAt) html += '<div style="font-size:11px;color:' + C.good + ';margin-top:8px">✓ Guardado ' + fmtDT(new Date(sc.savedAt)) + '</div>';
    html += '<button onclick="AppActions.saveSelfCapture(\'' + type + '\')" class="glow" style="width:100%;margin-top:10px;padding:11px;border-radius:9px;border:none;background:' + C.accent + ';color:' + C.bg + ';font-weight:700;font-size:13.5px;cursor:pointer">Guardar resultado</button>';
    html += '</div>';
    return html;
  }

      }
    } else if (notYetOpen) {
      var cd = fmtCountdown(m.opensAt);
      var urgent = (m.opensAt - state.now) <= 3 * 3600000;
      if (urgent) {
        html += '<div class="glow" style="background:' + C.panel2 + ';border:1px solid ' + C.accent + ';border-radius:10px;padding:10px 12px;text-align:center">';

    return html;

  function computeMondayPayments(sortedConfirmed, courtsCount) {
    var active = PAGO_COLLECTORS.filter(function (c) { return !c.minCourts || courtsCount > c.minCourts; });
    var excludeSet = {};
    active.forEach(function (c) { excludeSet[normalizeName(c.matchName)] = true; });
    var fixedSet = {};
    FIXED_PAYERS_TO_FONDO.forEach(function (n) { fixedSet[normalizeName(n)] = true; });
    var fixedPlaying = sortedConfirmed.filter(function (p) { return fixedSet[normalizeName(p.name)] && !excludeSet[normalizeName(p.name)]; });
    var available = sortedConfirmed.filter(function (p) { return !excludeSet[normalizeName(p.name)] && !fixedSet[normalizeName(p.name)]; });
    var idx = 0;
    return active.map(function (c) {
      var isPlaying = sortedConfirmed.some(function (p) { return normalizeName(p.name) === normalizeName(c.matchName); });
      var needed = c.forced4 ? 4 : (isPlaying ? 3 : 4);
      var names = [];
      if (c.forced4) {
        names = fixedPlaying.map(function (p) { return p.name; });
        needed = Math.max(0, needed - names.length);
      }
      var rest = available.slice(idx, idx + needed).map(function (p) { return p.name; });
      idx += needed;
      names = names.concat(rest);
      return { label: c.label, email: c.email, players: names };
    });
  }

  function renderAdmin() {
    if (!state.isAdmin) return '<div style="color:' + C.muted + ';font-size:13.5px;padding:20px;text-align:center">Tu cuenta no tiene permisos de administrador.</div>';
    var views = [["confirmaciones", "Confirmaciones"], ["canchas", "Canchas"], ["resultados", "Resultados"], ["ranking", "Ranking"], ["jugadores", "Jugadores"]];
    var html = '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px">';
    views.forEach(function (v) {
      var on = state.adminView === v[0];
      html += '<button onclick="AppActions.setAdminView(\'' + v[0] + '\')" style="flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid ' + (on ? C.accent : C.line) + ';background:' + (on ? C.panel2 : "transparent") + ';color:' + (on ? C.accent : C.muted) + ';font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap">' + v[1] + '</button>';

    html += '</div>';

    if (state.adminView === "canchas") html += renderCourtReorder();
    else if (state.adminView === "resultados") html += renderResultsPanel();
    else if (state.adminView === "ranking") html += renderAdminRanking();
    else if (state.adminView === "jugadores") html += renderAdminPlayers();

  function renderAdminConfirmaciones() {
    var html = '<div style="display:flex;gap:8px;margin-bottom:10px">';
    ["lunes", "miercoles"].forEach(function (t) {
      var on = state.adminSessionTab === t;
      html += '<button onclick="AppActions.setAdminTab(\'' + t + '\')" style="flex:1;padding:8px;border-radius:8px;border:1px solid ' + (on ? C.accent : C.line) + ';background:' + (on ? C.panel2 : "transparent") + ';color:' + (on ? C.accent : C.muted) + ';font-weight:600;font-size:12.5px;cursor:pointer">' + metas()[t].label + '</button>';
    });
    html += '</div>';

    html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.line + ';border-radius:10px;padding:10px;margin-bottom:10px">';
    html += '<div style="font-size:11px;color:' + C.muted + ';margin-bottom:6px">Añadir confirmación manual (para gente sin cuenta todavía — se liga sola cuando se registren)</div>';
    html += '<div style="display:flex;gap:6px">';
    html += '<input id="manual-name" value="' + esc(state.manualName) + '" oninput="AppActions.setManualName(this.value)" placeholder="Nombre" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid ' + C.line + ';background:' + C.panel2 + ';color:' + C.text + ';font-size:13px">';
    html += '<button onclick="AppActions.addManualConfirmation()" style="padding:8px 14px;border-radius:8px;border:none;background:' + C.accent + ';color:' + C.bg + ';font-weight:700;font-size:12.5px;cursor:pointer">+ Añadir</button></div>';

    var list = getActiveList(state.adminSessionTab);

      html += '<div style="padding:16px;color:' + C.muted + ';font-size:13px;text-align:center">Sin confirmaciones todavía.</div>';

        html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid ' + C.line + ';font-size:12.5px">';
        html += '<span class="mono" style="width:20px;color:' + C.muted + '">' + (i + 1) + '</span>';
        html += '<div style="flex:1"><div>' + esc(c.name) + (c.playerId ? "" : ' <span style="font-size:9.5px;color:#F2C94C;border:1px dashed #F2C94C;padding:1px 5px;border-radius:20px">sin cuenta</span>') + '</div><div class="mono" style="font-size:10px;color:' + C.muted + '">' + fmtExact(c.ts) + '</div></div>';
        html += '<span style="color:' + (i < capacityFor(state.adminSessionTab) ? C.good : "#F2C94C") + ';font-size:11px">' + (i < capacityFor(state.adminSessionTab) ? "confirmado" : "espera") + '</span>';
        if (!c.playerId) {
          html += '<button onclick="AppActions.linkConfirmation(\'' + c._id + '\',\'' + esc(c.name).replace(/'/g, "\\'") + '\')" style="background:transparent;border:1px solid ' + C.accent2 + ';border-radius:6px;color:' + C.accent2 + ';cursor:pointer;font-size:10.5px;padding:3px 8px">🔗 vincular</button>';
          html += '<button onclick="AppActions.editManualName(\'' + c._id + '\',\'' + esc(c.name).replace(/'/g, "\\'") + '\')" style="background:transparent;border:none;color:' + C.accent2 + ';cursor:pointer;font-size:13px">✏️</button>';
        }
        html += '<button onclick="AppActions.togglePaid(\'' + c._id + '\')" style="font-size:10.5px;padding:3px 8px;border-radius:6px;border:1px solid ' + (c.paid ? C.good : C.line) + ';background:transparent;color:' + (c.paid ? C.good : C.muted) + ';cursor:pointer">' + (c.paid ? "pagado" : "marcar pago") + '</button>';
        html += '<button onclick="AppActions.adminCancel(\'' + c._id + '\')" style="background:transparent;border:none;color:' + C.danger + ';cursor:pointer">✕</button></div>';
      });
    }
    html += '</div>';

    html += renderLateCancellations();
    return html;
  }

  function renderAdminRanking() {
    var html = '';

    html += '<div class="hd" style="font-size:16px;margin-bottom:8px">Añadir jugador nuevo</div>';
    var lastRank = state.ranking && state.ranking.list && state.ranking.list.length
      ? state.ranking.list.reduce(function (m, r) { return Math.max(m, r.rank); }, 0)
      : 0;
    html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.line + ';border-radius:12px;padding:12px;margin-bottom:20px">';
    html += '<div style="font-size:11.5px;color:' + C.muted + ';margin-bottom:8px">Se agrega automáticamente al final del ranking, en el lugar <span class="mono" style="color:' + C.accent + '">#' + (lastRank + 1) + '</span>.</div>';
    html += '<div style="display:flex;gap:8px">';
    html += '<input id="new-player-name" value="' + esc(state.newPlayerName) + '" oninput="AppActions.setNewPlayerName(this.value)" placeholder="Nombre completo" style="flex:1;padding:9px 12px;border-radius:8px;border:1px solid ' + C.line + ';background:' + C.panel2 + ';color:' + C.text + ';font-size:13px">';
    html += '<button onclick="AppActions.addNewPlayer()" style="padding:9px 14px;border-radius:8px;border:none;background:' + C.accent + ';color:' + C.bg + ';font-weight:700;font-size:13px;cursor:pointer">+ Añadir</button></div>';
    if (state.newPlayerError) html += '<div style="color:' + C.danger + ';font-size:11.5px;margin-top:6px">' + esc(state.newPlayerError) + '</div>';
    if (state.newPlayerAddedAt) html += '<div style="color:' + C.good + ';font-size:11.5px;margin-top:6px">✓ Agregado a las ' + fmtExact(state.newPlayerAddedAt) + '</div>';
    html += '</div>';

    html += '<div class="hd" style="font-size:16px;margin-bottom:8px">Editar ranking</div>';
    if (!state.ranking || !state.ranking.list || !state.ranking.list.length) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:14px;text-align:center;background:' + C.panel + ';border-radius:12px">Sin ranking cargado.</div>';
    } else {
      if (!state.rankingDraft) state.rankingDraft = state.ranking.list.map(function (r) { return { rank: r.rank, name: r.name }; });
      var draft = state.rankingDraft;
      var dirty = draft.some(function (d, i) { return d.rank !== state.ranking.list[i].rank || d.name !== state.ranking.list[i].name; });
      html += '<div style="font-size:11px;color:' + C.muted + ';margin-bottom:8px">Cambia el número o el nombre y dale "Guardar cambios" al final — nada se manda al servidor hasta entonces.</div>';
      html += '<div id="admin-rank-scroll" data-preserve-scroll="1" style="max-height:min(60vh,480px);overflow-y:auto;border:1px solid ' + C.line + ';border-radius:10px">';
      draft.forEach(function (r, i) {
        html += '<div style="display:flex;gap:6px;align-items:center;padding:6px 8px;' + (i < draft.length - 1 ? "border-bottom:1px solid " + C.line : "") + '">';
        html += '<input value="' + r.rank + '" oninput="AppActions.draftRankingRank(' + i + ',this.value)" class="mono" style="width:46px;padding:6px;border-radius:6px;border:1px solid ' + C.line + ';background:' + C.panel2 + ';color:' + C.text + ';font-size:12.5px">';
        html += '<input value="' + esc(r.name) + '" oninput="AppActions.draftRankingName(' + i + ',this.value)" style="flex:1;padding:6px;border-radius:6px;border:1px solid ' + C.line + ';background:' + C.panel2 + ';color:' + C.text + ';font-size:12.5px">';
        html += '</div>';
      });
      html += '</div>';
      if (state.rankingDraftError) html += '<div style="color:' + C.danger + ';font-size:11.5px;margin-top:8px">' + esc(state.rankingDraftError) + '</div>';
      html += '<div style="display:flex;gap:8px;margin-top:10px">';
      if (dirty) html += '<button onclick="AppActions.discardRankingDraft()" style="padding:9px 14px;border-radius:8px;border:1px solid ' + C.line + ';background:transparent;color:' + C.muted + ';font-size:13px;cursor:pointer">Descartar</button>';
      html += '<button onclick="AppActions.saveRankingDraft()" ' + (dirty ? "" : "disabled") + ' class="glow" style="flex:1;padding:10px;border-radius:8px;border:none;background:' + (dirty ? C.accent : C.line) + ';color:' + (dirty ? C.bg : C.muted) + ';font-weight:700;font-size:13px;cursor:' + (dirty ? "pointer" : "default") + '">💾 Guardar cambios' + (dirty ? "" : " (sin cambios)") + '</button>';
      html += '</div>';
    }
    return html;
  }

  function renderAdminPlayers() {
    var html = '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.line + ';border-radius:12px;padding:12px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    html += '<div class="mono" style="font-size:12.5px;color:' + C.accent + '">' + state.allPlayers.length + ' jugadores registrados</div>';
    html += '<button onclick="AppActions.refreshPlayers()" style="font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid ' + C.line + ';background:transparent;color:' + C.muted + ';cursor:pointer">↻ Actualizar</button></div>';
    if (state.playersRefreshedAt) {
      html += '<div class="mono" style="font-size:10px;color:' + C.muted + ';margin-bottom:8px">Leído del servidor a las ' + fmtExact(state.playersRefreshedAt) + '</div>';
    }
    html += '<div style="max-height:min(65vh,520px);overflow-y:auto">';
    if (!state.allPlayers.length) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:10px;text-align:center">Todavía no hay jugadores registrados.</div>';
    } else {
      state.allPlayers.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }).forEach(function (p) {
        var rk = findRank(p.name);
        html += '<div style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid ' + C.line + ';font-size:12.5px">';
        html += '<div style="flex:1"><div>' + esc(p.name) + '</div><div class="mono" style="font-size:10px;color:' + C.muted + '">' + esc(p.phone) + (p.email ? " · " + esc(p.email) : "") + '</div></div>';
        html += '<span class="mono" style="color:' + C.muted + ';font-size:11px">' + (rk == null ? "s/r" : "#" + rk) + '</span>';
        html += '<button onclick="AppActions.adminResetPassword(\'' + esc(p.phone).replace(/'/g, "\\'") + '\',\'' + esc(p.name).replace(/'/g, "\\'") + '\')" style="font-size:10px;padding:3px 7px;border-radius:6px;border:1px solid ' + C.accent2 + ';background:transparent;color:' + C.accent2 + ';cursor:pointer">🔑 resetear</button>';
        html += '</div>';
      });
    }
    html += '</div></div>';
    return html;
  }

  function getLateCancellations(type) {
    return (state.sessions[type] || []).filter(function (c) {
      return c.cancelled && c.late;
    }).sort(function (a, b) { return b.cancelledTs - a.cancelledTs; });
  }

  function fmtFull(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }) +
      ", " + d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function renderCourtReorder() {
    var type = state.adminSessionTab;
    var pending = state.ranking && state.ranking.list ? state.ranking.list.filter(function (r) { return r.pendingDropCount > 0; }) : [];
    var html = '<div class="hd" style="font-size:16px;margin-bottom:8px">Pendientes de bajar de cancha</div>';
    if (!pending.length) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:14px;text-align:center;background:' + C.panel + ';border-radius:12px;margin-bottom:20px">Nadie tiene una bajada pendiente ahorita.</div>';
    } else {
      html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.danger + ';border-radius:12px;overflow:hidden;margin-bottom:20px">';
      pending.forEach(function (r, i) {
        var courtNote = r.pendingDropFromCourt ? "bajó de Cancha " + esc(r.pendingDropFromCourt) : "bajada registrada antes de tener el dato de cancha";
        html += '<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;' + (i < pending.length - 1 ? "border-bottom:1px solid " + C.line : "") + '">';
        html += '<span class="mono" style="color:' + C.danger + ';font-size:14px;font-weight:700">↓' + (r.pendingDropFromCourt ? esc(r.pendingDropFromCourt) : "") + '</span>';
        html += '<div style="flex:1"><div style="font-size:13px">' + esc(r.name) + '</div><div class="mono" style="font-size:10px;color:' + C.muted + '">rank actual #' + r.rank + ' · ' + courtNote + '</div></div>';
        html += '<button onclick="AppActions.clearPendingDrop(\'' + esc(r.name).replace(/'/g, "\\'") + '\')" style="font-size:10px;padding:4px 8px;border-radius:6px;border:1px solid ' + C.line + ';background:transparent;color:' + C.muted + ';cursor:pointer">quitar</button>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<div class="hd" style="font-size:16px;margin-bottom:8px">Ajustar canchas a mano</div>';
    html += '<div style="display:flex;gap:8px;margin-bottom:10px">';
    ["lunes", "miercoles"].forEach(function (t) {
      var on = type === t;
      html += '<button onclick="AppActions.setAdminTab(\'' + t + '\')" style="flex:1;padding:8px;border-radius:8px;border:1px solid ' + (on ? C.accent : C.line) + ';background:' + (on ? C.panel2 : "transparent") + ';color:' + (on ? C.accent : C.muted) + ';font-weight:600;font-size:12.5px;cursor:pointer">' + metas()[t].label + '</button>';
    });
    html += '</div>';

    var occurrences = editableOccurrences(type);
    var mostRecentKey = pastOccurrences(type, 1)[0].key;
    var selectedKey = state.courtEditDate || mostRecentKey;
    var selectedOcc = occurrences.filter(function (o) { return o.key === selectedKey; })[0] || occurrences[0];

    if (!state.courtEditing) {
      html += '<div style="font-size:11px;color:' + C.muted + ';margin-bottom:8px">Elige la jornada que quieres ajustar — incluye las próximas 4 y las últimas 2.</div>';
      html += '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px">';
      occurrences.forEach(function (o) {
        var on = o.key === selectedKey;
        var tag = o.key === mostRecentKey ? " (última)" : (o.date > state.now ? " (próxima)" : "");
        html += '<button onclick="AppActions.setCourtEditDate(\'' + o.key + '\')" class="mono" style="flex:0 0 auto;padding:7px 11px;border-radius:8px;border:1px solid ' + (on ? C.accent : C.line) + ';background:' + (on ? C.panel2 : "transparent") + ';color:' + (on ? C.accent : C.muted) + ';font-size:11.5px;cursor:pointer;white-space:nowrap">' + fmtShort(o.date) + tag + '</button>';
      });
      html += '</div>';
      html += '<button onclick="AppActions.startCourtEdit(\'' + selectedKey + '\')" class="glow" style="padding:9px 14px;border-radius:9px;border:none;background:' + C.accent + ';color:' + C.bg + ';font-weight:700;font-size:13px;cursor:pointer">✏️ Editar canchas de ' + fmtShort(selectedOcc.date) + '</button>';
      return html;
    }

    if (!state.courtEditDraft) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:14px;text-align:center;background:' + C.panel + ';border-radius:12px">Cargando...</div>';
      return html;
    }

    if (!state.courtEditDraft.length) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:14px;text-align:center;background:' + C.panel + ';border-radius:12px">Sin confirmados para el ' + fmtShort(selectedOcc.date) + '.</div>';
      html += '<button onclick="AppActions.cancelCourtEdit()" style="margin-top:10px;padding:9px 14px;border-radius:9px;border:1px solid ' + C.line + ';background:transparent;color:' + C.muted + ';font-size:13px;cursor:pointer">← Volver</button>';
      return html;
    }

    var hasManual = state.courtEditDraft.some(function (court) { return court.some(function (c) { return c.manualOrder != null; }); });
    html += '<div class="mono" style="font-size:11px;color:' + C.muted + ';margin-bottom:6px">Editando: ' + fmtShort(selectedOcc.date) + '</div>';
    html += '<div style="font-size:11px;color:' + C.accent + ';margin-bottom:10px">Toca a un jugador y luego toca a otro para intercambiarlos de lugar. La ✕ lo elimina de esta jornada. Nada se guarda hasta que le des "Confirmar cambios".</div>';

    html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.line + ';border-radius:10px;padding:10px;margin-bottom:12px">';
    html += '<div style="font-size:11px;color:' + C.muted + ';margin-bottom:6px">Añadir jugador del ranking a esta jornada</div>';
    html += '<input id="court-edit-add-name" value="' + esc(state.courtEditAddName || "") + '" oninput="AppActions.setCourtEditAddName(this.value)" placeholder="Escribe un nombre..." style="width:100%;box-sizing:border-box;padding:9px 11px;border-radius:8px;border:1px solid ' + C.line + ';background:' + C.panel2 + ';color:' + C.text + ';font-size:13px">';
    if (state.courtEditAddName && state.courtEditAddName.trim() && state.ranking && state.ranking.list) {
      var q = normalizeName(state.courtEditAddName);
      var suggestions = state.ranking.list.filter(function (r) { return normalizeName(r.name).indexOf(q) !== -1; }).slice(0, 6);
      if (suggestions.length) {
        html += '<div style="border:1px solid ' + C.line + ';border-radius:8px;overflow:hidden;margin-top:6px">';
        suggestions.forEach(function (s, i) {
          html += '<div onclick="AppActions.addPlayerToCourtEdit(\'' + esc(s.name).replace(/'/g, "\\'") + '\')" style="padding:8px 11px;font-size:12.5px;cursor:pointer;' + (i < suggestions.length - 1 ? "border-bottom:1px solid " + C.line : "") + ';display:flex;justify-content:space-between"><span>' + esc(s.name) + '</span><span style="color:' + C.muted + '">rank ' + s.rank + '</span></div>';
        });
        html += '</div>';
      }
    }
    html += '</div>';

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">';
    var realCourts = state.courtEditRealCourts != null ? state.courtEditRealCourts : state.courtEditDraft.length;
    state.courtEditDraft.forEach(function (court, ci) {
      var isWaitlist = ci >= realCourts;
      html += '<div class="card" style="background:' + C.panel + ';border:1px ' + (isWaitlist ? "dashed #F2C94C" : "solid " + C.line) + ';border-radius:12px;padding:10px">';
      html += '<div class="hd mono" style="font-size:12px;color:' + (isWaitlist ? "#F2C94C" : C.accent) + ';margin-bottom:6px">' + (isWaitlist ? "LISTA DE ESPERA" : "CANCHA " + String.fromCharCode(65 + ci)) + '</div>';
      court.forEach(function (c, pi) {
        var sel = state.selectedChip && state.selectedChip.ci === ci && state.selectedChip.pi === pi;
        html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">';
        html += '<div onclick="AppActions.pickChip(' + ci + ',' + pi + ')" style="flex:1;padding:8px 9px;border-radius:8px;font-size:12.5px;cursor:pointer;background:' + (sel ? C.panel2 : "transparent") + ';border:1px solid ' + (sel ? C.accent : "transparent") + ';display:flex;justify-content:space-between">';
        html += '<span>' + esc(c.name) + '</span><span class="mono" style="color:' + C.muted + '">' + (c.rank == null ? "—" : c.rank) + '</span></div>';
        html += '<button onclick="AppActions.removeCourtEditPlayer(' + ci + ',' + pi + ')" title="Eliminar de esta jornada" style="background:transparent;border:none;color:' + C.danger + ';cursor:pointer;font-size:13px;padding:2px 4px">✕</button>';
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    html += '<div style="font-size:10.5px;color:' + C.muted + ';margin-bottom:10px">Para meter a alguien de la lista de espera, tócalo y luego toca a quien va a salir de la cancha.</div>';
    html += '<div style="display:flex;gap:8px">';

    html += '<button onclick="AppActions.confirmCourtEdit()" class="glow" style="flex:1;padding:9px 14px;border-radius:9px;border:none;background:' + C.accent + ';color:' + C.bg + ';font-weight:700;font-size:13px;cursor:pointer">✓ Confirmar cambios</button>';

  function renderLateCancellations() {

      html += '<div style="color:' + C.muted + ';font-size:13px;padding:14px;text-align:center;background:' + C.panel + ';border-radius:12px;border:1px solid ' + C.line + '">Ninguna cancelación fuera de tiempo por ahora.</div>';

    }
    html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + C.danger + ';border-radius:12px;overflow:hidden">';

      html += '<div style="padding:10px 12px;' + (i < all.length - 1 ? "border-bottom:1px solid " + C.line : "") + '">';

      html += '<div style="font-size:11.5px;color:' + C.text + ';margin-top:5px">' + m.label + ' — canceló el <span class="mono">' + fmtFull(item.c.cancelledTs) + '</span></div>';
      html += '<div class="mono" style="font-size:10.5px;color:' + C.muted + ';margin-top:2px">límite sin penalidad era ' + fmtDT(m.cancelDeadline) + '</div>';
      html += '<button onclick="AppActions.resolveLateCancellation(\'' + item.c._id + '\',\'' + item.type + '\')" style="margin-top:6px;font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid ' + C.good + ';background:transparent;color:' + C.good + ';cursor:pointer">✓ ya resuelta, quitar</button>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderResultsPanel() {
    var html = '<div class="hd" style="font-size:16px;margin:20px 0 8px">Resultados de la semana</div>';
    html += '<div style="display:flex;gap:8px;margin-bottom:12px">';
    ["lunes", "miercoles"].forEach(function (t) {
      var on = state.resultsType === t;
      html += '<button onclick="AppActions.setResultsType(\'' + t + '\')" style="flex:1;padding:8px;border-radius:8px;border:1px solid ' + (on ? C.accent : C.line) + ';background:' + (on ? C.panel2 : "transparent") + ';color:' + (on ? C.accent : C.muted) + ';font-weight:600;font-size:12.5px;cursor:pointer">' + (t === "lunes" ? "Lunes · Court X" : "Miércoles · The District") + '</button>';
    });
    html += '</div>';

    if (!state.resultsOccurrence) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:16px;text-align:center;background:' + C.panel + ';border-radius:12px">Cargando...</div>';
      return html;
    }

    html += '<div class="mono" style="font-size:11px;color:' + C.muted + ';margin-bottom:10px">Jornada del ' + fmtShort(state.resultsOccurrence.date) + '</div>';

    if (!state.resultsCourts || !state.resultsCourts.length) {
      html += '<div style="color:' + C.muted + ';font-size:13px;padding:16px;text-align:center;background:' + C.panel + ';border-radius:12px">No hay confirmados registrados todavía para esta jornada.</div>';
      return html;
    }

    if (state.resultsSavedAt && !state.resultsClosed) {
      html += '<div style="font-size:11.5px;color:' + C.good + ';margin-bottom:8px">✓ Guardado ' + fmtDT(new Date(state.resultsSavedAt)) + '</div>';
    }

    if (state.resultsClosed) {
      html += '<div style="background:' + C.panel2 + ';border:1px solid ' + C.good + ';border-radius:10px;padding:10px 12px;margin-bottom:12px">';
      html += '<div style="font-size:12.5px;color:' + C.good + ';font-weight:600">🔒 Resultados confirmados y ranking actualizado</div>';
      html += '<div class="mono" style="font-size:10.5px;color:' + C.muted + ';margin-top:2px">cerrado ' + fmtExact(state.resultsClosedAt) + '</div>';
      html += '<button onclick="AppActions.reopenResults()" style="margin-top:6px;font-size:10.5px;padding:4px 9px;border-radius:6px;border:1px solid ' + C.line + ';background:transparent;color:' + C.muted + ';cursor:pointer">🔓 Reabrir para corregir</button>';
      html += '</div>';
    } else {
      html += '<div style="font-size:12px;color:' + C.muted + ';margin-bottom:12px">Toca a los jugadores en el orden en que terminaron: primer toque = 1°, segundo = 2°... Toca de nuevo para quitar.</div>';
    }

    var badgeColor = { 1: C.accent, 2: C.accent2, 3: "#8C97B3", 4: C.danger };
    var badgeLabel = { 1: "🥇 1°", 2: "🥈 2°", 3: "🥉 3°", 4: "💩 4°" };

    state.resultsCourts.forEach(function (court, ci) {
      var pending = court.length < 4;
      var done = !pending && court.every(function (p) { return p.position; });
      html += '<div class="card" style="background:' + C.panel + ';border:1px solid ' + (done ? C.good : C.line) + ';border-radius:12px;padding:12px;margin-bottom:10px;' + (pending ? "opacity:0.55" : "") + (state.resultsClosed ? "opacity:0.7" : "") + '">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
      html += '<div class="hd mono" style="font-size:12.5px;color:' + C.accent + '">CANCHA ' + String.fromCharCode(65 + ci) + '</div>';
      if (pending) html += '<span style="font-size:9.5px;color:#F2C94C;border:1px dashed #F2C94C;padding:2px 6px;border-radius:20px;font-weight:600">pendiente de completar</span>';
      else if (done) html += '<span style="font-size:11px;color:' + C.good + '">✓ completa</span>';
      html += '</div>';
      court.forEach(function (p, pi) {
        if (pending || state.resultsClosed) {
          var closedBadge = (state.resultsClosed && p.position) ? '<span style="font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:' + badgeColor[p.position] + ';color:' + C.bg + '">' + badgeLabel[p.position] + '</span>' : '<span class="mono" style="color:' + C.muted + '">' + (p.rank == null ? "—" : p.rank) + '</span>';
          html += '<div style="display:flex;justify-content:space-between;padding:9px 8px;font-size:13.5px"><span>' + esc(p.name) + '</span>' + closedBadge + '</div>';
          return;
        }
        var badge = p.position ? '<span style="font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:' + badgeColor[p.position] + ';color:' + C.bg + '">' + badgeLabel[p.position] + '</span>' : '<span style="font-size:11.5px;color:' + C.muted + ';padding:4px 9px;border-radius:20px;border:1px dashed ' + C.line + '">toca aquí</span>';
        html += '<div onclick="AppActions.tapPosition(' + ci + ',' + pi + ')" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 8px;font-size:13.5px;cursor:pointer;border-radius:8px;margin-bottom:2px;background:' + (p.position ? "rgba(255,255,255,0.03)" : "transparent") + '">';
        html += '<span>' + esc(p.name) + '</span>' + badge + '</div>';
      });
      if (pending) {
        html += '<div style="font-size:10.5px;color:#F2C94C;margin-top:6px">Faltan ' + (4 - court.length) + ' para completar la cancha</div>';
      } else if (!state.resultsClosed && court.some(function (p) { return p.position; })) {
        html += '<button onclick="AppActions.clearCourt(' + ci + ')" style="margin-top:6px;font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid ' + C.line + ';background:transparent;color:' + C.muted + ';cursor:pointer">Limpiar cancha</button>';
      }
      html += '</div>';
    });

    if (!state.resultsClosed) {
      var anyPicked = state.resultsCourts.some(function (court) { return court.some(function (p) { return p.position; }); });
      var allComplete = state.resultsCourts.every(function (court) { return court.length < 4 || court.every(function (p) { return p.position; }); });
      html += '<button onclick="AppActions.saveResults()" style="width:100%;padding:10px;border-radius:9px;border:1px solid ' + C.line + ';background:transparent;color:' + C.text + ';font-weight:600;font-size:13px;cursor:pointer;margin-bottom:8px">Guardar avance</button>';
      html += '<button onclick="AppActions.confirmResultsWeek()" ' + (anyPicked ? "" : "disabled") + ' class="glow" style="width:100%;padding:12px;border-radius:9px;border:none;background:' + (anyPicked ? C.accent : C.line) + ';color:' + (anyPicked ? C.bg : C.muted) + ';font-weight:700;font-size:13.5px;cursor:' + (anyPicked ? "pointer" : "default") + '">✅ Confirmar resultados de la semana</button>';
      if (!allComplete) html += '<div style="font-size:10.5px;color:' + C.muted + ';margin-top:6px;text-align:center">Las canchas incompletas se ignoran al confirmar — no afectan el ranking.</div>';
    }
    return html;
  }

  function phoneEmail(phone) { return normalizePhone(phone) + "@unionpadel.app"; }

  function loadSessionData(type) {
    var m = metas()[type];
    return fetchConfirmations(type, m.key);
  }
  function loadAllSessions() {
    return Promise.all([loadSessionData("lunes"), loadSessionData("miercoles")]).then(function (r) {
      state.sessions = { lunes: r[0], miercoles: r[1] };
    });
  }
  function claimManualConfirmations(player) {
    var m = metas();
    var myName = normalizeName(player.name);
    return Promise.all(["lunes", "miercoles"].map(function (type) {
      return sb.from("confirmations").select("id,player_name").is("player_id", null)
        .eq("session_type", type).eq("session_date", m[type].key)
        .then(function (res) {
          if (!res.data || !res.data.length) return;
          var mine = res.data.filter(function (r) { return normalizeName(r.player_name) === myName; });
          return Promise.all(mine.map(function (r) {
            return sb.from("confirmations").update({ player_id: player.id }).eq("id", r.id);
          }));
        });
    }));
  }

  function patchAuthSubmitButton() {
    var btn = document.getElementById("auth-submit-btn");
    if (!btn) return;
    var phone = normalizePhone(state.loginPhone);
    var pw = state.loginPassword;
    var canSubmit = state.authMode === "signup"
      ? (!!phone && state.loginName.trim().length > 0 && pw.length >= 6 && !state.loggingIn)
      : (!!phone && pw.length > 0 && !state.loggingIn);
    btn.disabled = !canSubmit;
    btn.style.background = canSubmit ? C.accent : C.line;
    btn.style.color = canSubmit ? C.bg : C.muted;
    btn.style.cursor = canSubmit ? "pointer" : "default";
  }
  function patchPasswordField() {
    var input = document.getElementById("password-input");
    var hint = document.getElementById("pw-hint");
    var pw = state.loginPassword;
    var ok = pw.length >= 6;
    if (input && state.authMode === "signup") {
      input.style.borderColor = pw ? (ok ? C.good : C.danger) : C.line;
    }
    if (hint) hint.style.display = (pw && !ok) ? "block" : "none";
    patchAuthSubmitButton();
  }

  window.AppActions = {
    setPhone: function (v) { state.loginPhone = v; state.loginError = ""; patchAuthSubmitButton(); },
    setName: function (v) { state.loginName = v; state.loginError = ""; render(); },
    setEmail: function (v) { state.loginEmail = v; render(); },
    setPassword: function (v) { state.loginPassword = v; state.loginError = ""; patchPasswordField(); },
    togglePasswordVisibility: function () { state.showPassword = !state.showPassword; render(); },
    pickName: function (n) { state.loginName = n; render(); },
    setAuthMode: function (m) { state.authMode = m; state.loginError = ""; render(); },
    login: function () {
      var phone = normalizePhone(state.loginPhone);
      var password = state.loginPassword;
      state.loginError = "";
      if (!phone) { state.loginError = "Ingresa tu teléfono para continuar."; render(); return; }
      if (!password) { state.loginError = "Ingresa tu contraseña."; render(); return; }
      state.loggingIn = true; render();
      sb.auth.signInWithPassword({ email: phoneEmail(phone), password: password }).then(function (res) {
        if (res.error) {
          state.loginError = "Teléfono o contraseña incorrectos.";
          state.loggingIn = false; render(); return;
        }
        var authUser = res.data.user;
        return sb.from("players").select("*").eq("id", authUser.id).maybeSingle().then(function (pres) {
          if (pres.error) {
            state.loginError = "Hubo un problema cargando tu perfil. Intenta de nuevo.";
            state.loggingIn = false; render(); return;
          }
          if (!pres.data) {
            state.pendingProfileUser = { id: authUser.id, phone: phone };
            state.loggingIn = false; render(); return;
          }
          state.player = pres.data; state.isAdmin = !!pres.data.is_admin;
          state.loggingIn = false; state.tab = "inicio"; render();
          claimManualConfirmations(pres.data).then(function () { loadAllSessions().then(render); });
        });
      });
    },
    completeProfile: function () {
      var name = state.loginName.trim();
      state.loginError = "";
      if (!name) { state.loginError = "Escribe tu nombre."; render(); return; }
      var pu = state.pendingProfileUser;
      state.loggingIn = true; render();
      sb.from("players").insert({ id: pu.id, name: name, phone: pu.phone, email: state.loginEmail.trim() || null }).select().single().then(function (pres) {
        if (pres.error) {
          if (pres.error.message && pres.error.message.indexOf("players_pkey") !== -1) {
            sb.from("players").select("*").eq("id", pu.id).single().then(function (existing) {
              if (existing.error || !existing.data) {
                state.loginError = "Algo falló: " + pres.error.message;
                state.loggingIn = false; render(); return;
              }
              state.player = existing.data; state.isAdmin = !!existing.data.is_admin; state.pendingProfileUser = null;
              state.loggingIn = false; state.tab = "inicio"; render();
              claimManualConfirmations(existing.data).then(function () { loadAllSessions().then(render); });
            });
            return;
          }
          state.loginError = "Algo falló: " + pres.error.message;
          state.loggingIn = false; render(); return;
        }
        state.player = pres.data; state.isAdmin = false; state.pendingProfileUser = null;
        state.loggingIn = false; state.tab = "inicio"; render();
        claimManualConfirmations(pres.data).then(function () { loadAllSessions().then(render); });
      });
    },
    signup: function () {
      var phone = normalizePhone(state.loginPhone);
      var name = state.loginName.trim();
      var password = state.loginPassword;
      state.loginError = "";
      if (!phone) { state.loginError = "Ingresa tu teléfono."; render(); return; }
      if (!name) { state.loginError = "Escribe tu nombre."; render(); return; }
      if (password.length < 6) { state.loginError = "La contraseña debe tener al menos 6 caracteres."; render(); return; }

      state.loggingIn = true; render();
      sb.auth.signUp({ email: phoneEmail(phone), password: password }).then(function (res) {
        if (res.error) {
          state.loginError = res.error.message.indexOf("registered") !== -1
            ? "Ya existe una cuenta con ese teléfono. Inicia sesión en vez de registrarte."
            : "Algo falló: " + res.error.message;
          state.loggingIn = false; render(); return;
        }
        var uid = res.data.user.id;
        return sb.from("players").insert({ id: uid, name: name, phone: phone, email: state.loginEmail.trim() || null }).select().single().then(function (pres) {
          if (pres.error) {
            state.loginError = "Tu cuenta se creó pero hubo un problema guardando tus datos: " + pres.error.message;
            state.loggingIn = false; render(); return;
          }
          state.player = pres.data; state.isAdmin = false;
          state.loggingIn = false; state.tab = "inicio"; render();
          claimManualConfirmations(pres.data).then(function () { loadAllSessions().then(render); });
        });
      });
    },
    logout: function () {
      sb.auth.signOut().then(function () {
        state.player = null; state.isAdmin = false; state.loginPhone = ""; state.loginName = ""; state.loginEmail = ""; state.loginPassword = ""; state.authMode = "login";
        render();
      });
    },
    setTab: function (t) {
      state.tab = t;
      if (t === "ranking") state.rankingScrolled = false;
      if (t === "canchas") {
        var m = metas();
        state.courtTab = m.lunes.date <= m.miercoles.date ? "lunes" : "miercoles";
      }
      if (t === "admin" && !state.resultsOccurrence) AppActions.loadResults();
      if (t === "perfil" && !state.myResultsLoaded) {
        fetchMyResults(state.player.id).then(function (r) { state.myResults = r; state.myResultsLoaded = true; render(); });
      }
      if (t === "perfil" && !state.myHistoryLoaded) {
        fetchRankingHistory(state.player.name).then(function (r) { state.myHistory = r; state.myHistoryLoaded = true; render(); });
      }
      render();
    },
    jumpToMe: function () {
      var box = document.getElementById("ranking-scroll");
      var mine = document.getElementById("my-rank-row");
      if (box && mine) box.scrollTop = mine.offsetTop - box.clientHeight / 2 + mine.offsetHeight / 2;
    },
    setCourtTab: function (t) { state.courtTab = t; render(); },
    loadCanchasOverride: function (type, occ) {
      fetchConfirmations(type, occ.key).then(function (list) {
        var active = orderActive(list.filter(function (c) { return !c.cancelled; }));
        state.canchasOverride[type] = { key: occ.key, list: active };
        render();
      });
    },
    loadSelfCapture: function (type, slot) {
      var key = type + ":" + slot.occ.key + ":" + slot.courtIndex;
      Promise.all([
        sb.from("results_closed").select("*").eq("session_type", type).eq("session_date", slot.occ.key).maybeSingle(),
        sb.from("results").select("*").eq("session_type", type).eq("session_date", slot.occ.key).eq("court_index", slot.courtIndex)
      ]).then(function (r) {
        var closed = !!(r[0] && r[0].data);
        var court = slot.court.map(function (p) { return { name: p.name, playerId: p.playerId, position: null }; });
        var savedRows = (r[1] && r[1].data) || [];
        var savedAt = null;
        savedRows.forEach(function (row) {
          var p = court.filter(function (x) { return normalizeName(x.name) === normalizeName(row.player_name); })[0];
          if (p) p.position = row.position;
          savedAt = row.saved_at;
        });
        state.selfCapture[type] = { key: key, occ: slot.occ, courtIndex: slot.courtIndex, court: court, closed: closed, savedAt: savedAt ? new Date(savedAt).getTime() : null };
        state.selfCapture[type + "_loading"] = null;
        render();
      });
    },
    tapSelfPosition: function (type, pi) {
      var sc = state.selfCapture[type];
      if (!sc || sc.closed) return;
      var p = sc.court[pi];
      if (p.position) {
        p.position = null;
      } else {
        var used = sc.court.map(function (x) { return x.position; }).filter(Boolean);
        var next = [1, 2, 3, 4].filter(function (n) { return used.indexOf(n) === -1; })[0];
        p.position = next || null;
      }
      render();
    },
    saveSelfCapture: function (type) {
      var sc = state.selfCapture[type];
      if (!sc || sc.closed) return;
      var rows = sc.court.filter(function (p) { return p.position; }).map(function (p) {
        return {
          session_type: type, session_date: sc.occ.key, court_index: sc.courtIndex,
          player_id: p.playerId, player_name: p.name, position: p.position,
          saved_at: new Date().toISOString()
        };
      });
      if (!rows.length) { window.alert("Toca al menos a un jugador para guardar algo."); return; }
      sb.from("results").upsert(rows, { onConflict: "session_type,session_date,court_index,player_id" }).then(function (res) {
        if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
        sc.savedAt = Date.now();
        render();
      });
    },
    setAdminTab: function (t) { state.adminSessionTab = t; state.courtEditing = false; state.courtEditDate = null; render(); },
    setAdminView: function (v) {
      if (state.adminView === "ranking" && v !== "ranking") { state.rankingDraft = null; state.rankingDraftError = ""; }
      state.adminView = v;
      if (v === "jugadores" && !state.playersRefreshedAt) AppActions.refreshPlayers();
      render();
    },
    draftRankingRank: function (i, val) {
      var n = parseInt(val, 10);
      if (!state.rankingDraft) return;
      state.rankingDraft[i].rank = isNaN(n) ? state.rankingDraft[i].rank : n;
      state.rankingDraftError = "";
      render();
    },
    draftRankingName: function (i, val) {
      if (!state.rankingDraft) return;
      state.rankingDraft[i].name = val;
      state.rankingDraftError = "";
      render();
    },
    discardRankingDraft: function () {
      state.rankingDraft = null; state.rankingDraftError = "";
      render();
    },
    saveRankingDraft: function () {
      var draft = state.rankingDraft;
      var original = state.ranking.list;
      var seenRanks = {}, seenNames = {};
      for (var i = 0; i < draft.length; i++) {
        var name = draft[i].name.trim();
        if (!name) { state.rankingDraftError = "Ningún nombre puede quedar vacío (fila con rank " + draft[i].rank + ")."; render(); return; }
        var nk = normalizeName(name);
        if (seenNames[nk]) { state.rankingDraftError = "Hay dos personas con el mismo nombre: \"" + name + "\"."; render(); return; }
        seenNames[nk] = true;
        if (seenRanks[draft[i].rank] != null) { state.rankingDraftError = "Dos personas quedarían con el mismo número (#" + draft[i].rank + "): \"" + seenRanks[draft[i].rank] + "\" y \"" + name + "\"."; render(); return; }
        seenRanks[draft[i].rank] = name;
      }
      var ops = [];
      draft.forEach(function (d, i) {
        var orig = original[i];
        var name = d.name.trim();
        if (d.rank !== orig.rank || name !== orig.name) {
          ops.push(sb.from("ranking").update({ rank: d.rank, name: name, updated_at: new Date().toISOString() }).eq("name", orig.name));
        }
      });
      if (!ops.length) { state.rankingDraft = null; render(); return; }
      Promise.all(ops).then(function (results) {
        var err = results.filter(function (r) { return r.error; })[0];
        if (err) { state.rankingDraftError = "Algo falló: " + err.error.message; render(); return; }
        state.rankingDraft = null; state.rankingDraftError = "";
        fetchRanking().then(function (r) { state.ranking = r; render(); });

        player.position = null;
      } else {
        var used = court.map(function (p) { return p.position; }).filter(Boolean);
        var next = [1, 2, 3, 4].filter(function (n) { return used.indexOf(n) === -1; })[0];
        player.position = next || null;
      }
      render();
    },
    clearCourt: function (ci) {
      state.resultsCourts[ci].forEach(function (p) { p.position = null; });
      render();
    },
    saveResults: function () {
      var occ = state.resultsOccurrence;
      var type = state.resultsType;
      var rows = [];
      state.resultsCourts.forEach(function (court, ci) {
        court.forEach(function (p) {
          if (!p.position) return;
          rows.push({
            session_type: type, session_date: occ.key, court_index: ci,
            player_id: p.playerId, player_name: p.name, position: p.position,
            saved_at: new Date().toISOString()
          });
        });
      });
      sb.from("results").upsert(rows, { onConflict: "session_type,session_date,court_index,player_id" }).then(function (res) {
        if (res.error) { window.alert("Algo falló: " + res.error.message); return; }
        state.resultsSavedAt = Date.now(); render();
      });
    }
  };

  function boot() {
    setInterval(function () { state.now = new Date(); if (state.player && state.tab === "inicio") render(); }, 1000);

    sb.auth.getSession().then(function (sres) {
      var session = sres.data.session;
      var playerPromise = session
        ? sb.from("players").select("*").eq("id", session.user.id).maybeSingle().then(function (r) { return r.data || null; })
        : Promise.resolve(null);

      Promise.all([fetchRanking(), playerPromise]).then(function (r) {
        state.ranking = r[0];
        state.player = r[1];
        state.isAdmin = !!(r[1] && r[1].is_admin);
        if (session && !r[1]) {
          state.pendingProfileUser = { id: session.user.id, phone: (session.user.email || "").split("@")[0] };
        }
        var sessionsPromise = state.player ? loadAllSessions() : Promise.resolve();
        sessionsPromise.then(function () {
          state.loading = false;
          render();
        });
      });
    });

    render();
  }

  boot();
})();
</script>
</body>
</html>
